<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- CSP: XSS時の被害を縮小する。スクリプトはすべて外部ファイル (script-src 'self' のみ)。
       インラインscriptはCSPで完全拒否されるため、新規JSは必ず assets/js/ に置くこと。
       connect-src の workers.dev は ateney-api のホスト。Worker移転時はここも更新。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://*.ateney-ai.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>認証中 - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <script src="/config.js"></script>
  <script src="/auth.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
      background: #f5f5f7;
      color: #1a1a1a;
    }
    body.dark {
      background: #0d0d0f;
      color: #f5f5f7;
    }
    .callback-card {
      text-align: center;
      padding: 48px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border, #d1d1d6);
      border-top-color: #5b8def;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .status { font-size: 0.85rem; color: #6e6e73; }
    body.dark .status { color: #98989d; }
    .error { color: #ff4757; font-size: 0.85rem; margin-top: 16px; }
    .back {
      display: inline-block;
      margin-top: 20px;
      color: #5b8def;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="callback-card">
    <div class="spinner"></div>
    <div class="title">認証中...</div>
    <div class="status" id="status">しばらくお待ちください</div>
    <div class="error" id="error"></div>
  </div>

<script src="assets/js/page-callback.js"></script>
</body>
</html>
