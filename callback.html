<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>認証中 - ateney</title>
  <script src="/config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
      background: #f5f5f7;
      color: #1a1a1a;
    }
    body.dark {
      background: #0d0d0f;
      color: #f5f5f7;
    }
    .callback-card {
      text-align: center;
      padding: 48px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border, #d1d1d6);
      border-top-color: #5b8def;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .status { font-size: 0.85rem; color: #6e6e73; }
    body.dark .status { color: #98989d; }
    .error { color: #ff4757; font-size: 0.85rem; margin-top: 16px; }
    .back {
      display: inline-block;
      margin-top: 20px;
      color: #5b8def;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="callback-card">
    <div class="spinner"></div>
    <div class="title">認証中...</div>
    <div class="status" id="status">しばらくお待ちください</div>
    <div class="error" id="error"></div>
    <a href="/login.html" class="back">← ログイン画面に戻る</a>
  </div>

  <script>
    // ダークモード復元
    try {
      if (localStorage.getItem("ateney-dark") === "1") {
        document.body.classList.add("dark");
      }
    } catch (e) {}

    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const cfg = window.ATENEY_CONFIG || {};
    const redirectBase = cfg.REDIRECT_BASE || window.location.origin;

    function setError(msg) {
      errorEl.textContent = msg;
      statusEl.textContent = "エラーが発生しました";
    }

    /* =========================
       URLパラメータ解析（GET = LINE, Apple redirect_mode=query）
       ========================= */
    async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.replace("#", ""));

      // LINE: ?code=xxx&state=xxx
      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");

      if (error) {
        setError(`OAuth error: ${error} - ${params.get("error_description") || ""}`);
        return;
      }

      if (code && state) {
        // どのプロバイダのstateと一致するかで判定
        let provider = null;
        if (state === sessionStorage.getItem("line-state")) provider = "line";
        else if (state === sessionStorage.getItem("google-state")) provider = "google";

        if (!provider) {
          setError("state検証失敗: 不正なコールバックです");
          return;
        }
        sessionStorage.removeItem(`${provider}-state`);

        if (provider === "line") {
          statusEl.textContent = "LINE認証コード受信。トークン交換中...";
          const verifier = sessionStorage.getItem("line-verifier");
          sessionStorage.removeItem("line-verifier");

          // ⚠️ トークン交換（/oauth2/v2.1/token）はchannel_secretが必要で
          // 静的サイトでは実行できない。本番ではCloudflare Workerで行う。
          logLine("LINE code受信: " + code.substring(0, 20) + "...");
          statusEl.textContent = "LINE認証完了（POC: トークン交換はWorkerで実装）";
        } else if (provider === "google") {
          statusEl.textContent = "Google認証コード受信。トークン交換中...";

          // ⚠️ こちらもclient_secretが必要なため静的サイトでは完結しない。
          // 本番ではCloudflare Workerでトークン交換する。
          logLine("Google code受信: " + code.substring(0, 20) + "...");
          statusEl.textContent = "Google認証完了（POC: トークン交換はWorkerで実装）";
        }

        setTimeout(() => { window.location.href = "/"; }, 2000);
        return;
      }

      // Apple: response_mode=form_post の場合はPOSTだが、
      // GitHub PagesではPOSTを受け取れないので、
      // response_mode=queryに変更する必要がある。
      // → Appleはform_postのみサポートしているため、
      //   Cloudflare Workerを経由する必要がある。

      // Google: callbackは不要（GISがJWTを直接返す）

      setError("不明なコールバックです。ログイン画面からやり直してください。");
    }

    function logLine(msg) {
      console.log(msg);
    }

    handleCallback().catch(err => setError(err.message));
  </script>
</body>
</html>
