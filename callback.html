<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>認証中 - ateney</title>
  <script src="/config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", sans-serif;
      background: #f5f5f7;
      color: #1a1a1a;
    }
    body.dark {
      background: #0d0d0f;
      color: #f5f5f7;
    }
    .callback-card {
      text-align: center;
      padding: 48px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border, #d1d1d6);
      border-top-color: #5b8def;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; }
    .status { font-size: 0.85rem; color: #6e6e73; }
    body.dark .status { color: #98989d; }
    .error { color: #ff4757; font-size: 0.85rem; margin-top: 16px; }
    .back {
      display: inline-block;
      margin-top: 20px;
      color: #5b8def;
      text-decoration: none;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="callback-card">
    <div class="spinner"></div>
    <div class="title">認証中...</div>
    <div class="status" id="status">しばらくお待ちください</div>
    <div class="error" id="error"></div>
  </div>

  <script>
    // ダークモード復元
    try {
      if (localStorage.getItem("ateney-dark") === "1") {
        document.body.classList.add("dark");
      }
    } catch (e) {}

    const statusEl = document.getElementById("status");
    const errorEl = document.getElementById("error");
    const cfg = window.ATENEY_CONFIG || {};
    const redirectBase = cfg.REDIRECT_BASE || window.location.origin;

    /* =========================
       ログユーティリティ（console両方に出す）
    ========================= */
    function logLine(msg) {
      console.log("[ateney callback]", msg);
    }

    function setError(msg) {
      errorEl.textContent = msg;
      statusEl.textContent = "エラーが発生しました";
      console.error("[ateney callback]", msg);
    }

    /* =========================
       URLパラメータ解析
       GET = LINE, Google（response_type=code のリダイレクト）
       Apple は response_mode=form_post のため別途Worker経由が必要
       ========================= */
    async function handleCallback() {
      const params = new URLSearchParams(window.location.search);

      const code = params.get("code");
      const state = params.get("state");
      const error = params.get("error");

      console.log("[ateney callback] query params:", Object.fromEntries(params));

      if (error) {
        setError(`OAuth error: ${error} - ${params.get("error_description") || ""}`);
        return;
      }

      if (code && state) {
        // どのプロバイダのstateと一致するかで振り分ける
        let provider = null;
        if (state === sessionStorage.getItem("line-state")) provider = "line";
        else if (state === sessionStorage.getItem("google-state")) provider = "google";

        if (!provider) {
          setError("state検証失敗: 不正なコールバックです");
          return;
        }
        sessionStorage.removeItem(`${provider}-state`);
        logLine(`provider判定: ${provider}`);

        if (provider === "line") {
          statusEl.textContent = "LINE認証コード受信。トークン交換中...";

          const verifier = sessionStorage.getItem("line-verifier");
          sessionStorage.removeItem("line-verifier");

          if (!verifier) {
            setError("PKCE verifierが見つかりません。セッションが切れました。");
            return;
          }

          const apiBase = cfg.API_BASE || "";
          if (!apiBase) {
            setError("API_BASEが未設定です。config.jsを確認してください。");
            return;
          }

          const redirectUri = `${redirectBase}/callback.html`;

          try {
            logLine("LINE code → Workerに送信中...");
            statusEl.textContent = "サーバーで認証処理中...";

            const res = await fetch(`${apiBase}/login/line`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                code: code,
                verifier: verifier,
                redirect_uri: redirectUri,
              }),
            });

            if (!res.ok) {
              const errBody = await res.text();
              throw new Error(`Worker応答エラー (${res.status}): ${errBody}`);
            }

            const user = await res.json();
            logLine(`LINE認証成功: name=${user.name}, id=${user.id}`);

            // localStorageに保存（メインページで使用）
            localStorage.setItem("ateney-user", JSON.stringify({
              name: user.name,
              id: user.id,
              provider: "line",
              sub: user.sub || "",
              token: user.token || "",
            }));

            statusEl.textContent = "LINE認証完了！リダイレクト中...";
            setTimeout(() => { window.location.href = "/"; }, 1000);
          } catch (err) {
            setError(`LINE認証エラー: ${err.message}`);
          }
        } else if (provider === "google") {
          statusEl.textContent = "Google認証コード受信。トークン交換中...";

          // ⚠️ 注意: トークン交換（/oauth2/v2/token）はclient_secretが必要で
          // 静的サイトでは実行できない。本番ではCloudflare Workerで行う。
          logLine("Google code受信: " + code.substring(0, 20) + "...");

          // 本番フロー:
          // const tokenResponse = await fetch("https://oauth2.googleapis.com/token", {
          //   method: "POST",
          //   headers: { "Content-Type": "application/x-www-form-urlencoded" },
          //   body: new URLSearchParams({
          //     grant_type: "authorization_code",
          //     code: code,
          //     redirect_uri: `${redirectBase}/callback.html`,
          //     client_id: cfg.GOOGLE_CLIENT_ID,
          //     client_secret: "【Worker側で設定】",
          //   }),
          // });

          statusEl.textContent = "Google認証完了（POC: トークン交換はWorkerで実装）";
        }

        setTimeout(() => { window.location.href = "/"; }, 2000);
        return;
      }

      // Apple: response_mode=form_post の場合はPOSTだが、
      // GitHub PagesではPOSTを受け取れないので、
      // response_mode=queryに変更する必要がある。
      // → Appleはform_postのみサポートしているため、
      //   Cloudflare Workerを経由する必要がある。

      setError("不明なコールバック、なんかあると思ったら大間違い！ただ受け取る場所だからな。悪用できないで～");
      setTimeout(() => { window.location.href = "/"; }, 5000);
    }

    handleCallback().catch(err => setError(err.message));
  </script>
</body>
</html>
