<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- CSP: XSS時の被害を縮小する。スクリプトはすべて外部ファイル (script-src 'self' のみ)。
       インラインscriptはCSPで完全拒否されるため、新規JSは必ず assets/js/ に置くこと。
       connect-src の workers.dev は ateney-api のホスト。Worker移転時はここも更新。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://*.ateney-ai.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="キャラ・シーン・RAG・packをまとめて見る道具箱">

  <title>Library - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <script src="/config.js"></script>

  <link rel="stylesheet" href="/common.css">
  <style>
/* =========================================================
   library — 道具箱 (オーナーUIシート準拠, 2026-10-08)
   リスト行 + ···メニュー + インライン詳細。
   シェル側id (overlay, menu 等13個) と被らないよう lib* 接頭辞。
   ========================================================= */

    /* --- 作成ボタン --- */
    .lib-create-btn {
      display: block;
      width: 100%;
      max-width: 420px;
      margin-bottom: 16px;
      padding: 12px 16px;
      border: 1.5px dashed var(--accent);
      border-radius: 12px;
      color: var(--accent);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s var(--ease), transform 0.2s var(--ease);
    }
    .lib-create-btn:hover {
      background: var(--bg-elevated);
      transform: translateY(-1px);
    }

    /* --- リストビュー --- */
    .lib-app {
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: lib-fadein 0.4s var(--ease) forwards;
    }
    @keyframes lib-fadein {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lib-app.hidden { display: none; }

    .lib-filter {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin: 0 0 20px;
      padding: 0;
      list-style: none;
    }
    .lib-filter button {
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 999px;
      padding: 5px 14px;
      cursor: pointer;
      transition: color 0.2s var(--ease), border-color 0.2s var(--ease), background 0.2s var(--ease);
    }
    .lib-filter button:hover { color: var(--text); }
    .lib-filter button.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--bg-elevated);
    }

    .lib-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 420px;
    }

    .lib-row {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
      opacity: 0;
      transform: translateY(10px);
      animation: lib-row-in 0.35s var(--ease) forwards;
      animation-delay: calc(var(--row-index, 0) * 60ms);
    }
    @keyframes lib-row-in {
      to { opacity: 1; transform: translateY(0); }
    }
    .lib-row:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px var(--shadow);
      border-color: var(--accent);
    }
    .lib-row:active { transform: translateY(0) scale(0.995); }
    .lib-row:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .lib-row:focus:not(:focus-visible) { outline: none; }

    .lib-thumb {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--border), var(--bg-elevated));
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 1.3rem;
      font-weight: 700;
      text-transform: uppercase;
    }
    .lib-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .lib-row-info {
      flex: 1;
      min-width: 0;
    }
    .lib-row-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lib-kind {
      display: inline-block;
      flex-shrink: 0;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--border);
      color: var(--text-secondary);
    }
    .lib-kind.k-pack { background: var(--accent); color: #fff; }
    .lib-kind.k-own { background: transparent; border: 1px solid var(--border); }

    .lib-row-dates {
      font-size: 0.72rem;
      color: var(--text-secondary);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .lib-menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-secondary);
      padding: 4px 8px;
      margin: -4px -6px;
      border-radius: 8px;
      flex-shrink: 0;
      transition: color 0.2s var(--ease), background 0.2s var(--ease);
    }
    .lib-menu-btn:hover { color: var(--text); background: var(--border); }

    /* --- 状態表示 (空/エラー) --- */
    .lib-state {
      max-width: 420px;
      text-align: center;
      color: var(--text-secondary);
      padding: 40px 0;
      font-size: 0.9rem;
      line-height: 1.8;
    }
    .lib-state .state-emoji { font-size: 2rem; display: block; margin-bottom: 8px; }

    /* --- 詳細ビュー --- */
    .lib-detail {
      display: none;
      width: 100%;
      max-width: 720px;
      animation: lib-fadein 0.3s var(--ease) forwards;
    }
    .lib-detail.active { display: block; }

    .lib-detail-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .lib-back-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.5rem;
      color: var(--accent);
      padding: 4px 10px;
      margin-left: -10px;
      border-radius: 8px;
      transition: background 0.2s var(--ease);
    }
    .lib-back-btn:hover { background: var(--border); }
    .lib-detail-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lib-dates-info {
      display: flex;
      gap: 28px;
      margin: 20px 0 24px;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .lib-date-item { display: flex; flex-direction: column; gap: 3px; }
    .lib-date-label {
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.06em;
    }
    .lib-date-value { color: var(--text); }

    .lib-section { margin-bottom: 26px; }
    .lib-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .lib-section-content {
      color: var(--text);
      line-height: 1.7;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .lib-subsection {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .lib-subsection-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .lib-subsection-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .lib-subsection-item {
      font-size: 0.85rem;
      color: var(--text);
      padding: 8px 12px;
      background: var(--bg);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
      line-height: 1.5;
    }
    .lib-subsection-item .sub-name { font-weight: 600; }
    .lib-subsection-item .sub-desc {
      display: block;
      color: var(--text-secondary);
      font-size: 0.78rem;
      margin-top: 2px;
    }

    .lib-badges { display: flex; gap: 6px; flex-wrap: wrap; }
    .lib-badge {
      font-size: 0.66rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .lib-badge.b-public { border-color: var(--accent); color: var(--accent); }
    .lib-badge.b-packonly { border-color: var(--text-secondary); color: var(--text-secondary); }

    /* --- ··· メニュー (ボトムシート) --- */
    .lib-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1001;
    }
    .lib-overlay.active { display: block; }

    .lib-popup {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -4px 16px var(--shadow);
      z-index: 1002;
      animation: lib-slideup 0.3s var(--ease) forwards;
    }
    .lib-popup.active { display: block; }
    @keyframes lib-slideup {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .lib-popup-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 480px;
      margin: 0 auto;
    }
    .lib-popup-item {
      padding: 13px 16px;
      border-radius: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text);
      text-align: left;
      transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .lib-popup-item:hover { border-color: var(--accent); }
    .lib-popup-item:disabled { opacity: 0.5; cursor: default; }
    .lib-popup-item.danger { color: #c23b41; }
    .lib-popup-item.danger:hover { border-color: #c23b41; }

    /* --- 名前の変更ダイアログ --- */
    .lib-dialog {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lib-dialog.active { display: flex; }
    .lib-dialog-content {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      animation: lib-fadein 0.2s var(--ease) forwards;
    }
    .lib-dialog-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
    }
    .lib-dialog-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.92rem;
      margin-bottom: 20px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
    }
    .lib-dialog-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .lib-dialog-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }
    .lib-dialog-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.2s var(--ease);
    }
    .lib-dialog-btn:hover { border-color: var(--text-secondary); }
    .lib-dialog-btn.confirm {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .lib-dialog-btn.confirm:hover { opacity: 0.9; }

    /* --- スマホ --- */
    @media (max-width: 480px) {
      .lib-list { gap: 10px; }
      .lib-row { padding: 10px; }
      .lib-thumb { width: 44px; height: 44px; }
      .lib-row-dates { font-size: 0.68rem; gap: 10px; }
    }
  </style>
</head>

<body>
<script src="/assets/js/darkmode-early.js"></script>
<script src="/auth.js"></script>
  <script src="/common.js"></script>

  <!-- HEADER / OVERLAY / SLIDE MENU は common.js が注入する (Issue #9) -->

  <main class="main">
    <div class="main-inner">
      <h2>library <span style="font-size:0.85rem;font-weight:400;color:var(--text-secondary)">— packをまとめる道具箱</span></h2>

      <div class="lib-app" id="libApp">
        <!-- フィルタ -->
        <ul class="lib-filter" id="libFilter">
          <li><button type="button" data-source="all" class="active">すべて</button></li>
          <li><button type="button" data-source="own">自作</button></li>
          <li><button type="button" data-source="added">導入した</button></li>
        </ul>

        <!-- 作成ボタン (pack = 複数同梱の「作品」。ミニ作成フロート) -->
        <button type="button" class="lib-create-btn" id="libCreateBtn">＋ packを作る</button>

        <!-- リストビュー -->
        <div class="lib-list" id="libList"></div>
        <div id="libStateWrap"></div>
      </div>

      <!-- 詳細ビュー (同ページ内切替) -->
      <div class="lib-detail" id="libDetail">
        <div class="lib-detail-header">
          <button type="button" class="lib-back-btn" id="libBackBtn" aria-label="一覧に戻る">←</button>
          <div class="lib-detail-title" id="libDetailTitle"></div>
        </div>
        <div class="lib-dates-info" id="libDetailDates"></div>
        <div id="libDetailBody"></div>
      </div>
    </div>
  </main>

  <!-- ··· メニュー用オーバーレイ/ボトムシート (シェルの #overlay と被らないID) -->
  <div class="lib-overlay" id="libOverlay"></div>
  <div class="lib-popup" id="libPopup" role="menu">
    <div class="lib-popup-content" id="libPopupContent"></div>
  </div>

  <!-- 名前の変更ダイアログ -->
  <div class="lib-dialog" id="libRenameDlg" role="dialog" aria-modal="true">
    <div class="lib-dialog-content">
      <div class="lib-dialog-title" id="libRenameTitle">名前の変更</div>
      <input type="text" class="lib-dialog-input" id="libRenameInput" maxlength="100" placeholder="新しい名前" autocomplete="off">
      <div class="lib-dialog-buttons">
        <button type="button" class="lib-dialog-btn" id="libRenameCancel">キャンセル</button>
        <button type="button" class="lib-dialog-btn confirm" id="libRenameOk">変更</button>
      </div>
    </div>
  </div>

<script src="/assets/js/pack-ui.js?v=20261009"></script>
<script src="/assets/js/page-library.js?v=20261009"></script>
</body>
</html>
