<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- CSP: XSS時の被害を縮小する。スクリプトはすべて外部ファイル (script-src 'self' のみ)。
       インラインscriptはCSPで完全拒否されるため、新規JSは必ず assets/js/ に置くこと。
       connect-src の workers.dev は ateney-api のホスト。Worker移転時はここも更新。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://*.ateney-ai.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="作ったものをまとめて見るライブラリ">

  <title>Library - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <script src="/config.js"></script>

    <link rel="stylesheet" href="/common.css">
  <style>
/* library GRID */

    #library-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .library-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-elevated);
      cursor: pointer;

      opacity: 0;
      transform: translateY(20px) scale(0.97);
      animation: card-in 0.5s var(--ease) forwards;

      transition:
        transform 0.3s var(--ease),
        box-shadow 0.3s var(--ease),
        border-color 0.3s var(--ease);
    }

    @keyframes card-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .library-card { animation-delay: calc(var(--card-index, 0) * 70ms); }

    .library-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px var(--shadow);
      border-color: var(--accent);
    }

    .library-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .library-card .card-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--border);
    }

    .library-card .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--ease);
    }

    .library-card:hover .card-image img {
      transform: scale(1.08);
    }

    .card-image-fallback {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 2.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .library-info {
      padding: 14px 16px;
    }

    .library-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px;
      color: var(--text);
    }

    .library-info p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* =========================
       RESPONSIVE — スマホ対応
    ========================= */

    /* カードグリッド */
    @media (max-width: 768px) {
      #library-list {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }
    }
    @media (max-width: 480px) {
      #library-list {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
    }
    @media (max-width: 360px) {
      #library-list {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 8px;
      }
      .library-info { padding: 10px 12px; }
      .library-info h3 { font-size: 0.88rem; }
      .library-info p { font-size: 0.75rem; }
    }



    /* Issue #5: ライブラリ削除ボタン */
    .library-card { position: relative; }
    .library-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 5;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 15px;
      line-height: 28px;
      text-align: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s var(--ease), background 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .library-card:hover .library-remove,
    .library-remove:focus-visible { opacity: 1; }
    .library-remove:hover { background: #c23b41; }
    .library-remove:disabled { opacity: 0.5; cursor: default; }
    @media (hover: none) {
      .library-remove { opacity: 0.85; } /* タッチ端末は常時表示 */
    }
  </style>
</head>

<body>
<script src="/assets/js/darkmode-early.js"></script>
<script src="/auth.js"></script>
  <script src="/common.js"></script>

  <!-- HEADER / OVERLAY / SLIDE MENU は common.js が注入する (Issue #9) -->

  <main class="main">
    <div class="main-inner">
      <h2>library</h2>
      <div id="library-list"></div>
    </div>
  </main>

<script src="assets/js/page-library.js"></script>
</body>
</html>
