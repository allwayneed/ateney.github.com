<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン - ateney</title>

  <!-- ビルド時に生成される config.js -->
  <script src="/config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f7;
      --bg-elevated: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #6e6e73;
      --border: #d1d1d6;
      --shadow: rgba(0, 0, 0, 0.08);
      --accent: #5b8def;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition: 0.35s var(--ease);
    }

    body.dark {
      --bg: #0d0d0f;
      --bg-elevated: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --border: #38383a;
      --shadow: rgba(0, 0, 0, 0.4);
      --accent: #7c9fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
      position: relative;
    }

    /* Floating blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 320px; height: 320px;
      background: var(--accent);
      top: -80px; left: -60px;
      animation: blob-1 18s var(--ease) infinite;
    }
    .blob-2 {
      width: 260px; height: 260px;
      background: #ff6b9d;
      bottom: -60px; right: -40px;
      animation: blob-2 22s var(--ease) infinite;
    }
    @keyframes blob-1 {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(40px,30px) scale(1.1); }
      66% { transform: translate(-20px,50px) scale(0.95); }
    }
    @keyframes blob-2 {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(-30px,-40px) scale(1.15); }
      66% { transform: translate(20px,-20px) scale(0.9); }
    }

    /* Dark mode toggle */
    .darkmode {
      position: fixed; top: 16px; right: 20px;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer;
      color: var(--text); border-radius: 50%; z-index: 100;
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      transition: background 0.2s var(--ease), color var(--transition);
    }
    .darkmode:active { background: var(--bg-elevated); }
    .darkmode .toggle-track { position: relative; width: 26px; height: 26px; }
    .darkmode .sun-core {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: currentColor; transform: translate(-50%,-50%);
      transition: all 0.4s var(--ease);
    }
    .darkmode .moon-cover {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--bg);
      transform: translate(-50%,-50%) translateX(0);
      opacity: 0;
      transition: opacity 0.4s var(--ease), background var(--transition), transform 0.4s var(--ease);
    }
    .darkmode .rays {
      position: absolute; top: 50%; left: 50%;
      width: 26px; height: 26px;
      transform: translate(-50%,-50%);
      animation: rays-spin 20s linear infinite;
    }
    @keyframes rays-spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
    .darkmode .rays span {
      position: absolute; top: 0; left: 50%;
      width: 2px; height: 5px; border-radius: 2px;
      background: currentColor;
      transform-origin: 50% 13px;
      transform: translateX(-50%) rotate(calc(var(--i) * 45deg));
      transition: height 0.3s var(--ease), opacity 0.3s var(--ease);
    }
    .darkmode.active .rays { animation-play-state: paused; }
    .darkmode.active .rays span { height: 0; opacity: 0; }
    .darkmode.active .moon-cover {
      opacity: 1;
      transform: translate(-50%,-50%) translateX(5px) translateY(-2px);
    }

    /* Login card */
    .login-card {
      position: relative; z-index: 1;
      width: min(90%, 400px);
      padding: 40px 32px 32px;
      border-radius: 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      box-shadow: 0 12px 48px var(--shadow);
      text-align: center;
      opacity: 0;
      transform: translateY(24px) scale(0.96);
      animation: card-enter 0.6s var(--ease-spring) forwards;
      transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
    }
    @keyframes card-enter { to { opacity: 1; transform: translateY(0) scale(1); } }

    .logo {
      font-size: 2rem; font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px; cursor: default;
    }
    .logo span {
      display: inline-block;
      transition: transform 0.4s var(--ease-spring);
    }
    .logo:hover span { animation: logo-wave 0.8s var(--ease); }
    @keyframes logo-wave {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .logo span:nth-child(1) { animation-delay: 0ms; }
    .logo span:nth-child(2) { animation-delay: 60ms; }
    .logo span:nth-child(3) { animation-delay: 120ms; }
    .logo span:nth-child(4) { animation-delay: 180ms; }
    .logo span:nth-child(5) { animation-delay: 240ms; }
    .logo span:nth-child(6) { animation-delay: 300ms; }

    .subtitle {
      margin: 0 0 28px; color: var(--text-secondary); font-size: 0.9rem;
    }

    /* 全OAuthボタン共通スタイル（Google/LINE/Apple統一デザイン） */
    .oauth-btn {
      width: 100%; height: 48px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      border: 1px solid var(--border); border-radius: 12px;
      background: var(--bg-elevated); color: var(--text);
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }
    .oauth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--shadow);
    }
    .oauth-btn:active { transform: scale(0.98); }
    .oauth-btn + .oauth-btn { margin-top: 10px; }
    .oauth-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .oauth-btn.line {
      background: #06C755; border-color: #06C755; color: white;
    }
    .oauth-btn.line:hover { box-shadow: 0 6px 20px rgba(6,199,85,0.35); }

    .oauth-btn.yahoo {
        background: #ff0033; color: white;
    }
    .oauth-btn.yahoo:hover { box-shadow: 0 6px 20px rgba(255, 104, 104, 0.35); }
    .oauth-btn.apple {
      background: #000; border-color: #000; color: #fff;
    }
    body.dark .oauth-btn.apple { background: #fff; color: #000; }

    .oauth-btn.loading { pointer-events: none; opacity: 0.7; }
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid currentColor; border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .oauth-btn.loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      margin: 24px 0 16px;
      display: flex; align-items: center; gap: 12px;
      color: var(--text-secondary); font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: var(--border);
    }

    .notice {
      font-size: 0.75rem; line-height: 1.6;
      color: var(--text-secondary); margin-top: 20px;
    }
    .notice a { color: var(--accent); text-decoration: none; }
    .notice a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <div class="blob blob-2"></div>

    <p class="subtitle">ateneyはateney、おいしいateney</p>

    <!-- Google: LINE/Appleと統一した自作ボタン。フルリダイレクト方式

    <button class="oauth-btn google" id="google-login">
      <svg viewBox="0 0 24 24">

        <path fill="#34A853" d="M12 21.7c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.29v2.53A9.74 9.74 0 0 0 12 21.7z"/>
        <path fill="#FBBC05" d="M6.54 13.78A5.86 5.86 0 0 1 6.24 12c0-.62.11-1.22.3-1.78V7.69H3.29A9.74 9.74 0 0 0 2.25 12c0 1.57.38 3.05 1.04 4.31l3.25-2.53z"/>
        <path fill="#EA4335" d="M12 6.19c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.24 14.63 2.3 12 2.3a9.74 9.74 0 0 0-8.71 5.39l3.25 2.53C7.31 7.91 9.46 6.19 12 6.19z"/>

    <!-- LINE -->
    <button class="oauth-btn line" id="line-login">
      <img src="/assets/line_32.png" alt="" class="line-icon">
      <span class="spinner"></span>
      LINEでログイン
    </button>
    <button class="oauth-btn yahoo" id="yahoo-login">
        <svg width="64" height="36" viewBox="0 0 64 36" fill="none" xmlns="http://www.w3.org/2000/svg">

            <path d="M46.9543 33.9231L44.1792 33.1981L46.1243 28.7229L48.8144 29.6904L51.397 30.3755L49.4694 34.7481L46.9518 33.9206L46.9543 33.9231ZM52.5046 26.5353L48.5119 25.3128L54.9372 4.33444L64 7.10955L62.2199 10.0122L52.5046 26.5353Z" fill="#ffffff"/>
        </svg>
        <span class="spinner"></span>
        Yahoo!でログイン
    </button>
    <button class="oauth-btn microsoft" id="microsoft-login">

        Microsoftでログイン
    </button>
    <!-- Apple -->
    <button class="oauth-btn apple" id="apple-login">

    <div class="divider">または、、、と思わせるための線</div>

    <p class="notice">

    </p>
  </main>

  <script>
    /* =========================
       DARK MODE
    ========================= */
    const darkmodeButton = document.getElementById("darkmodeButton");
    function applyDarkMode(on) {
      document.body.classList.toggle("dark", on);
      darkmodeButton.classList.toggle("active", on);
    }
    try {
      const saved = localStorage.getItem("ateney-dark");
      if (saved === "1") applyDarkMode(true);
    } catch (e) {}
    darkmodeButton.addEventListener("click", () => {
      const isDark = !document.body.classList.contains("dark");
      applyDarkMode(isDark);
      try { localStorage.setItem("ateney-dark", isDark ? "1" : "0"); } catch (e) {}
    });

    /* =========================
       LOGO WAVE
    ========================= */
    const logo = document.getElementById("logo");
    logo.addEventListener("mouseenter", () => {
      logo.querySelectorAll("span").forEach(s => {
        s.style.animation = "none";
        void s.offsetWidth;
        s.style.animation = "";
      });
    });

    /* =========================
       DEBUG LOGGER（パネル + console両方に出す）
    ========================= */
    const debugEl = document.getElementById("debug");
    function log(msg, type = "") {
      // const div = document.createElement("div");
      // if (type) div.className = type;
      // div.textContent = msg;
      // debugEl.appendChild(div);
      // debugEl.scrollTop = debugEl.scrollHeight;

      const prefix = "[ateney]";
      if (type === "err") console.error(prefix, msg);
      else if (type === "ok") console.log(`%c${prefix} ${msg}`, "color:#06C755");
      else if (type === "info") console.info(prefix, msg);
      else console.log(prefix, msg);
    }

    /* =========================
       CONFIG CHECK
    ========================= */
    const cfg = window.ATENEY_CONFIG || {};

    log(`config loaded: ${JSON.stringify(cfg, null, 0)}`, "info");

    const hasGoogle = cfg.GOOGLE_CLIENT_ID && cfg.GOOGLE_CLIENT_ID !== "";
    const hasLine   = cfg.LINE_CHANNEL_ID && cfg.LINE_CHANNEL_ID !== "";
    const hasmicrosoft = cfg.MICROSOFT_CLIENT_ID && cfg.MICROSOFT_CLIENT_ID !== "";
    const hasyahoo = cfg.YAHOO_CLIENT_ID && cfg.YAHOO_CLIENT_ID !== "";
    const hasApple  = cfg.APPLE_CLIENT_ID && cfg.APPLE_CLIENT_ID !== "";

    if (!hasGoogle) log("⚠ GOOGLE_CLIENT_ID 未設定", "err");
    if (!hasLine)   log("⚠ LINE_CHANNEL_ID 未設定", "err");
    if (!hasApple)  log("⚠ APPLE_CLIENT_ID 未設定", "err");
    if (!hasyahoo)  log("⚠ YAHOO_CLIENT_ID 未設定", "err")
    if (!hasmicrosoft) log("⚠ MICROSOFT_CLIENT_ID 未設定", "err")

    const redirectBase = cfg.REDIRECT_BASE || window.location.origin;

    /* =========================
       共通ユーティリティ
    ========================= */
    function generateState() {
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      return Array.from(arr, b => b.toString(16).padStart(2, "0")).join("");
    }

    async function generatePKCE() {
      const arr = new Uint8Array(32);
      crypto.getRandomValues(arr);
      const verifier = Array.from(arr, b => b.toString(16).padStart(2, "0")).join("");

      const encoder = new TextEncoder();
      const digest = await crypto.subtle.digest("SHA-256", encoder.encode(verifier));
      const challenge = btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");

      return { verifier, challenge };
    }

    /* =========================
       GOOGLE OAUTH（Authorization Code + フルリダイレクト方式）
       ---------------------------------------------------------------
       以前はinitTokenClient()のポップアップ方式だったが、拡張機能/
       サードパーティCookie制限でブロックされる環境があったため、
       LINE/Appleと同じフルリダイレクト方式に統一。
       これによりGISのSDK自体が不要になった。
    ========================= */
    document.getElementById("google-login").addEventListener("click", function () {
      if (!hasGoogle) {
        log("Google: CLIENT_ID未設定", "err");
        return;
      }

      this.classList.add("loading");

      const state = generateState();
      sessionStorage.setItem("google-state", state);

      const redirectUri = `${redirectBase}/callback.html`;
      const params = new URLSearchParams({
        response_type: "code",
        client_id: cfg.GOOGLE_CLIENT_ID,
        redirect_uri: redirectUri,
        state: state,
        scope: "openid email profile",
        access_type: "online",
        prompt: "select_account",
      });

      log("Google: リダイレクト中...", "info");
      log(`redirect: ${redirectUri}`, "info");

      window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?${params}`;
    });

    /* =========================
       LINE OAUTH (Authorization Code + PKCE)
    ========================= */
    document.getElementById("line-login").addEventListener("click", async function() {
      if (!hasLine) {
        log("LINE: CHANNEL_ID未設定", "err");
        return;
      }

      this.classList.add("loading");

      const state = generateState();
      const { verifier, challenge } = await generatePKCE();

      // PKCE verifierをsessionStorageに保存（コールバックで使う）
      sessionStorage.setItem("line-verifier", verifier);
      sessionStorage.setItem("line-state", state);

      const redirectUri = `${redirectBase}/callback.html`;
      const params = new URLSearchParams({
        response_type: "code",
        client_id: cfg.LINE_CHANNEL_ID,
        redirect_uri: redirectUri,
        state: state,
        scope: "profile openid email",
        code_challenge: challenge,
        code_challenge_method: "S256",
      });

      log(`LINE: リダイレクト中...`, "info");
      log(`redirect: ${redirectUri}`, "info");

      window.location.href = `https://access.line.me/oauth2/v2.1/authorize?${params}`;
    });
    /* =========================
       Microsoft oauth
    ==========================*/
    document.getElementById("microsoft-login").addEventListener("click", async function () {
      this.classList.add("loading");
    
      try {
        const state = generateState();
        const { verifier, challenge } = await generatePKCE();
      
        // PKCE verifier / stateをコールバックで使用
        sessionStorage.setItem("microsoft-verifier", verifier);
        sessionStorage.setItem("microsoft-state", state);
      
        const redirectUri = `${redirectBase}/callback.html`;
      
        const params = new URLSearchParams({
          client_id: cfg.MICROSOFT_CLIENT_ID,
          response_type: "code",
          redirect_uri: redirectUri,
          response_mode: "query",
          scope: "openid profile email",
          state: state,
          code_challenge: challenge,
          code_challenge_method: "S256",
        });
      
        log("Microsoft: リダイレクト中...", "info");
        log(`redirect: ${redirectUri}`, "info");
      
        window.location.href =
          `https://login.microsoftonline.com/common/oauth2/v2.0/authorize?${params}`;
      
      } catch (err) {
        console.error("Microsoft OAuth error:", err);
        log(`Microsoft: ${err.message}`, "err");
        this.classList.remove("loading");
      }
    });
    document.getElementById("yahoo-login").addEventListener("click", async function () {
      this.classList.add("loading");

      try {
        const state = generateState();
        const { verifier, challenge } = await generatePKCE();
      
        // PKCE verifier / stateをコールバックで使用
        sessionStorage.setItem("yahoo-verifier", verifier);
        sessionStorage.setItem("yahoo-state", state);
      
        const redirectUri = `${redirectBase}/callback.html`;
      
        const params = new URLSearchParams({
          client_id: cfg.YAHOO_CLIENT_ID,
          redirect_uri: redirectUri,
          response_type: "code",
          scope: "openid",
          state: state,
          code_challenge: challenge,
          code_challenge_method: "S256",
        });
      
        log("Yahoo!: リダイレクト中...", "info");
        log(`redirect: ${redirectUri}`, "info");
      
        window.location.href =
          `https://auth.login.yahoo.co.jp/yconnect/v2/authorization?${params}`;
      
      } catch (err) {
        console.error("Yahoo! OAuth error:", err);
        log(`Yahoo!: ${err.message}`, "err");
        this.classList.remove("loading");
      }
    });

    /* =========================
       APPLE OAUTH (Sign in with Apple JS)
    ========================= */
    document.getElementById("apple-login").addEventListener("click", async function() {
      if (!hasApple) {
        log("Apple: CLIENT_ID未設定", "err");
        return;
      }

      this.classList.add("loading");

      const state = generateState();
      sessionStorage.setItem("apple-state", state);

      const redirectUri = `${redirectBase}/callback.html`;

      // Appleは "Sign in with Apple JS" フレームワークを使うのが正式
      // ここではリダイレクト方式で試す
      const params = new URLSearchParams({
        client_id: cfg.APPLE_CLIENT_ID,
        redirect_uri: redirectUri,
        response_type: "code id_token",
        scope: "name email",
        response_mode: "form_post",
        state: state,
      });

      log(`Apple: リダイレクト中...`, "info");
      log(`redirect: ${redirectUri}`, "info");

      window.location.href = `https://appleid.apple.com/auth/authorize?${params}`;
    });

    log("=== 初期化完了 ===", "ok");
  </script>
</body>
</html>
