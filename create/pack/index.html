<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- CSP: XSS時の被害を縮小する。スクリプトはすべて外部ファイル (script-src 'self' のみ)。
       インラインscriptはCSPで完全拒否されるため、新規JSは必ず assets/js/ に置くこと。
       connect-src の workers.dev は ateney-api のホスト。Worker移転時はここも更新。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://*.ateney-ai.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="packを作成・編集する (キャラ+シーン+RAGの詰め合わせ)">
  <meta name="robots" content="noindex">

  <title>Create pack - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">

  <script src="/config.js"></script>
  <script src="/auth.js"></script>

  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/create/create.css">
</head>

<body>
<script src="/assets/js/darkmode-early.js"></script>
<script src="/common.js"></script>

  <!-- HEADER / OVERLAY / SLIDE MENU は common.js が注入する -->

  <main class="main">
    <div class="main-inner">
      <h2 id="pageTitle">pack を作る</h2>

      <form id="editorForm" class="editor-form" novalidate>
        <div class="field">
          <label for="pk-name">名前 (必須)</label>
          <input type="text" id="pk-name" name="name" maxlength="100" required autocomplete="off">
          <div class="hint">詰め合わせの名前 (例: 洋館ミステリー詰め合わせ)</div>
        </div>
        <div class="field">
          <label for="pk-description">説明</label>
          <textarea id="pk-description" name="description" maxlength="2000" placeholder="このpackに入っているもの、楽しみ方"></textarea>
        </div>
        <div class="field">
          <label for="pk-tags">タグ</label>
          <input type="text" id="pk-tags" name="tags" maxlength="200" placeholder="カンマ区切り" autocomplete="off">
        </div>
        <div class="field">
          <label for="pk-genre">ジャンル</label>
          <input type="text" id="pk-genre" name="genre" maxlength="100" autocomplete="off">
        </div>

        <div class="field">
          <label>同梱キャラ (自分の作品から最大10体)</label>
          <div id="pk-char-list" class="pk-pick-list">
            <p class="hint">読み込み中...</p>
          </div>
        </div>
        <div class="field">
          <label>同梱シーン (自分の作品から最大10つ)</label>
          <div id="pk-scene-list" class="pk-pick-list">
            <p class="hint">読み込み中...</p>
          </div>
        </div>
        <div class="field">
          <label>同梱RAG (自分の作品から最大20個)</label>
          <div id="pk-rag-list" class="pk-pick-list">
            <p class="hint">読み込み中...</p>
          </div>
        </div>

        <div class="field">
          <label class="check-row"><input type="checkbox" name="is_public"> 公開する (pack一覧に載ります)</label>
          <div class="hint">同梱物がpack専用の部品でも、このページで選べば同梱できます</div>
        </div>

        <p class="status" id="status"></p>
        <div class="form-actions">
          <a class="btn" href="/create/">戻る</a>
          <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
          <button type="button" class="btn btn-danger" id="deleteBtn" hidden>削除</button>
        </div>
      </form>
    </div>
  </main>

<script src="/assets/js/page-create-pack.js"></script>
</body>
</html>
