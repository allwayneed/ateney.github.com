<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- CSP: XSS時の被害を縮小する。スクリプトはすべて外部ファイル (script-src 'self' のみ)。
       インラインscriptはCSPで完全拒否されるため、新規JSは必ず assets/js/ に置くこと。
       connect-src の workers.dev は ateney-api のホスト。Worker移転時はここも更新。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://*.ateney-ai.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RAGドキュメントを作成・編集する">
  <meta name="robots" content="noindex">

  <title>Create RAG - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">

  <script src="/config.js"></script>
  <script src="/auth.js"></script>

  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/create/create.css">
</head>

<body>
<script src="/assets/js/darkmode-early.js"></script>
<script src="/common.js"></script>

  <!-- HEADER / OVERLAY / SLIDE MENU は common.js が注入する -->

  <main class="main">
    <div class="main-inner">
      <h2 id="pageTitle">RAG を作る</h2>

      <form id="editorForm" class="editor-form" novalidate>
        <div class="field">
          <label for="f-title">タイトル (必須)</label>
          <input type="text" id="f-title" name="title" maxlength="200" required autocomplete="off">
        </div>
        <div class="field">
          <label for="f-content">内容</label>
          <textarea id="f-content" name="content" class="tall" maxlength="50000" placeholder="キャラに覚えさせたい知識・設定・資料を書く"></textarea>
          <div class="hint">RAGはあなた専用の知識ベース。他のユーザーには見えません</div>
        </div>
        <div class="field">
          <label for="f-source">出典 (source)</label>
          <input type="text" id="f-source" name="source" maxlength="500" placeholder="引用元・URLなど (任意)" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-tags">タグ</label>
          <input type="text" id="f-tags" name="tags" maxlength="200" placeholder="カンマ区切り" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-genre">ジャンル</label>
          <input type="text" id="f-genre" name="genre" maxlength="100" autocomplete="off">
        </div>
        <p class="status" id="status"></p>
        <div class="form-actions">
          <a class="btn" href="/create/">戻る</a>
          <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
          <button type="button" class="btn btn-danger" id="deleteBtn" hidden>削除</button>
        </div>
      </form>
    </div>
  </main>

<script src="assets/js/page-create-rag.js"></script>
</body>
</html>
