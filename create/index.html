<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="キャラクター・シーン・RAGを作成する">

  <title>Create - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">

  <script src="/config.js"></script>

    <link rel="stylesheet" href="/common.css">
  <style>
/* CHARACTER GRID */

    #character-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .character-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-elevated);
      cursor: pointer;

      opacity: 0;
      transform: translateY(20px) scale(0.97);
      animation: card-in 0.5s var(--ease) forwards;

      transition:
        transform 0.3s var(--ease),
        box-shadow 0.3s var(--ease),
        border-color 0.3s var(--ease);
    }

    @keyframes card-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .character-card { animation-delay: calc(var(--card-index, 0) * 70ms); }

    .character-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px var(--shadow);
      border-color: var(--accent);
    }

    .character-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .character-card .card-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--border);
    }

    .character-card .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--ease);
    }

    .character-card:hover .card-image img {
      transform: scale(1.08);
    }

    .card-image-fallback {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 2.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .character-info {
      padding: 14px 16px;
    }

    .character-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px;
      color: var(--text);
    }

    .character-info p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* =========================
       RESPONSIVE — スマホ対応
    ========================= */

    /* カードグリッド */
    @media (max-width: 768px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }
    }
    @media (max-width: 480px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
    }
    @media (max-width: 360px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 8px;
      }
      .character-info { padding: 10px 12px; }
      .character-info h3 { font-size: 0.88rem; }
      .character-info p { font-size: 0.75rem; }
    }

    /* =========================
       CREATE PAGE — create-menu
    ========================= */
    /* +create トグルボタン */
    .create-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 14px;
        border: 1.5px solid var(--border);
        border-radius: 14px;
        background: var(--bg-elevated);
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s var(--ease);
        -webkit-tap-highlight-color: transparent;
    }

    .create-toggle svg {
        width: 20px;
        height: 20px;
        transition: transform 0.3s var(--ease);
    }

    .create-toggle:hover {
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 4px 14px rgba(91, 141, 239, 0.12);
    }

    .create-toggle:active {
        transform: scale(0.98);
    }

    .create-toggle.open svg {
        transform: rotate(45deg);
    }

    /* create-menu — スライド式 */
    .create-menu {
        display: flex;
        gap: 10px;
        list-style: none;
        padding: 0;
        margin-bottom: 28px;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transform: translateY(-8px);
        transition: max-height 0.35s var(--ease), opacity 0.25s var(--ease), transform 0.3s var(--ease), margin-bottom 0.3s var(--ease);
    }

    .create-menu.open {
        max-height: 200px;
        opacity: 1;
        transform: translateY(0);
        margin-bottom: 28px;
    }

    .create-menu:not(.open) {
        margin-bottom: 0;
    }

    .create-menu li a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 10px 18px;
        border-radius: 12px;
        border: 1.5px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.2s var(--ease);
        -webkit-tap-highlight-color: transparent;
    }

    .create-menu li a:hover {
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 4px 14px rgba(91, 141, 239, 0.12);
    }

    .create-menu li a:active {
        transform: translateY(0) scale(0.97);
    }

    /* =========================
       CREATE PAGE — filter
    ========================= */
    .filter {
        display: flex;
        gap: 8px;
        list-style: none;
        margin-bottom: 20px;
    }

    .filter li a {
        display: inline-block;
        padding: 7px 16px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-secondary);
        font-size: 0.82rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s var(--ease);
        -webkit-tap-highlight-color: transparent;
    }

    .filter li a:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .filter li a.active {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
    }

    body.dark .filter li a.active {
        color: #0d0d0f;
    }

    /* =========================
       CREATE PAGE — item-list
    ========================= */
    .item-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .item-list li a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-elevated);
        color: var(--text);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        transition: all 0.2s var(--ease);
        -webkit-tap-highlight-color: transparent;
    }

    .item-list li a:hover {
        border-color: var(--accent);
        box-shadow: 0 4px 12px var(--shadow);
        transform: translateX(4px);
    }

    .item-list li a:active {
        transform: translateX(2px) scale(0.99);
    }

    .item-list .item-thumb {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--border);
        flex-shrink: 0;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        font-size: 1rem;
        font-weight: 700;
    }

    .item-list .item-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .item-list .item-name {
        flex: 1;
    }

    .item-list .item-type {
        font-size: 0.72rem;
        color: var(--text-secondary);
        background: var(--bg);
        padding: 3px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
    }

    /* item-list — ローディング */
    .item-skeleton {
        height: 44px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: linear-gradient(90deg, var(--border) 25%, var(--bg-elevated) 50%, var(--border) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
    }

    /* CREATE PAGE — 小さい画面用 */
    @media (max-width: 480px) {
      .create-toggle {
        padding: 11px 12px;
        font-size: 0.82rem;
        border-radius: 12px;
      }
      .create-toggle svg {
        width: 17px;
        height: 17px;
      }
      .create-menu {
        gap: 8px;
      }
      .create-menu li a {
        padding: 9px 14px;
        font-size: 0.78rem;
        border-radius: 10px;
      }
      .filter {
        gap: 6px;
        margin-bottom: 16px;
      }
      .filter li a {
        padding: 6px 12px;
        font-size: 0.76rem;
      }
      .item-list li a {
        padding: 10px 12px;
        gap: 10px;
      }
      .item-list .item-thumb {
        width: 32px;
        height: 32px;
      }
    }

  
  
  </style>
</head>

<body>
  <script>
    /* ダークモードFOUC防止 — 描画前にbodyへクラスを付与 (実体はcommon.js) */
    try { if (localStorage.getItem("ateney-dark") === "1") document.body.classList.add("dark"); } catch (e) {}
  </script>
  <script src="/common.js"></script>

  <!-- HEADER / OVERLAY / SLIDE MENU は common.js が注入する (Issue #9) -->

  <main class="main">
    <div class="main-inner">
        <h2>Create</h2>
        <button class="create-toggle" id="createToggle" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            create
        </button>
        <ul class="create-menu" id="createMenu">
            <li><a href="/create/character/">character</a></li>
            <li><a href="/create/scene/">scene</a></li>
            <li><a href="/create/rag/">RAG</a></li>
        </ul>
        <ul class="filter" id="filter">
            <li><a href="#c" data-type="character" class="active">character</a></li>
            <li><a href="#s" data-type="scene">scene</a></li>
            <li><a href="#r" data-type="rag">RAG</a></li>
        </ul>
        <ul class="item-list" id="itemList">
            <!-- 動的に生成 -->
        </ul>
    </div>
  </main>

  <script>
/* +create トグル */
    var createToggle = document.getElementById("createToggle");
    var createMenu = document.getElementById("createMenu");
    createToggle.addEventListener("click", function() {
      var isOpen = createMenu.classList.toggle("open");
      createToggle.classList.toggle("open", isOpen);
      createToggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
    });

    /* =========================
       CREATE — filter + item list
    ========================= */
    var cfg = window.ATENEY_CONFIG || {};
    var apiBase = (cfg && cfg.API_BASE) || "";
    if (!apiBase) {
      itemList.innerHTML = '<li style="color:var(--text-secondary);padding:24px 0;text-align:center;font-size:0.88rem;">設定ファイル (config.js) が読み込めていません 😴</li>';
    }
    var filterTabs = document.querySelectorAll("#filter a");
    var itemList = document.getElementById("itemList");

    filterTabs.forEach(function(tab) {
      tab.addEventListener("click", function(e) {
        e.preventDefault();
        filterTabs.forEach(function(t) { t.classList.remove("active"); });
        tab.classList.add("active");
        loadItems(tab.getAttribute("data-type"));
      });
    });

    function getAuthHeaders() {
      var token = localStorage.getItem("ateney-token");
      return token ? { "Authorization": "Bearer " + token } : {};
    }

    function loadItems(type) {
      var skel = "";
      for (var i = 0; i < 4; i++) skel += '<li><div class="item-skeleton"></div></li>';
      itemList.innerHTML = skel;

      fetch(apiBase + "/api/" + type, { headers: getAuthHeaders() })
        .then(function(res) { if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
        .then(function(data) {
          var items = data.characters || data.scenes || data.documents || data.items || data || [];
          if (!Array.isArray(items) || items.length === 0) {
            itemList.innerHTML = '<li style="color:var(--text-secondary);padding:24px 0;text-align:center;font-size:0.88rem;">まだ何も作ってないよ ✨</li>';
            return;
          }
          itemList.innerHTML = "";
          items.forEach(function(item, i) {
            var li = document.createElement("li");
            var a = document.createElement("a");
            a.href = "/" + type + "/" + (item.id || item.uuid || "") + "/";
            var thumb = document.createElement("div");
            thumb.className = "item-thumb";
            if (item.avatar_url || item.image_url) {
              var img = document.createElement("img");
              img.src = item.avatar_url || item.image_url;
              img.alt = item.name || item.title || "";
              img.loading = "lazy";
              img.addEventListener("error", function() { thumb.textContent = (item.name||item.title||"?").charAt(0).toUpperCase(); });
              thumb.appendChild(img);
            } else {
              thumb.textContent = (item.name || item.title || "?").charAt(0).toUpperCase();
            }
            var name = document.createElement("span");
            name.className = "item-name";
            name.textContent = item.name || item.title || "Untitled";
            var tag = document.createElement("span");
            tag.className = "item-type";
            tag.textContent = type;
            a.appendChild(thumb); a.appendChild(name); a.appendChild(tag);
            a.style.opacity = "0"; a.style.transform = "translateY(10px)";
            a.style.transition = "opacity 0.3s var(--ease), transform 0.3s var(--ease)";
            setTimeout(function() { a.style.opacity = "1"; a.style.transform = "translateY(0)"; }, i * 50);
            li.appendChild(a); itemList.appendChild(li);
          });
        })
        .catch(function(err) {
          console.error("loadItems error:", err);
          itemList.innerHTML = '<li style="color:var(--text-secondary);padding:24px 0;text-align:center;font-size:0.88rem;">読み込めなかった 😴</li>';
        });
    }

    loadItems("character");
    </script>
</body>
</html>
