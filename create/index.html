<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- CSP: XSS時の被害を縮小する。スクリプトはすべて外部ファイル (script-src 'self' のみ)。
       インラインscriptはCSPで完全拒否されるため、新規JSは必ず assets/js/ に置くこと。
       connect-src の workers.dev は ateney-api のホスト。Worker移転時はここも更新。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://*.ateney-ai.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="キャラクター・シーン・RAGを作成する">

  <title>Create - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">

  <script src="/config.js"></script>
  <script src="/auth.js"></script>

    <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/create/create.css">
  <style>
/* CHARACTER GRID */

    #character-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .character-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-elevated);
      cursor: pointer;

      opacity: 0;
      transform: translateY(20px) scale(0.97);
      animation: card-in 0.5s var(--ease) forwards;

      transition:
        transform 0.3s var(--ease),
        box-shadow 0.3s var(--ease),
        border-color 0.3s var(--ease);
    }

    @keyframes card-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .character-card { animation-delay: calc(var(--card-index, 0) * 70ms); }

    .character-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px var(--shadow);
      border-color: var(--accent);
    }

    .character-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .character-card .card-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--border);
    }

    .character-card .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--ease);
    }

    .character-card:hover .card-image img {
      transform: scale(1.08);
    }

    .card-image-fallback {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 2.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .character-info {
      padding: 14px 16px;
    }

    .character-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px;
      color: var(--text);
    }

    .character-info p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* =========================
       RESPONSIVE — スマホ対応
    ========================= */

    /* カードグリッド */
    @media (max-width: 768px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }
    }
    @media (max-width: 480px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
    }
    @media (max-width: 360px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 8px;
      }
      .character-info { padding: 10px 12px; }
      .character-info h3 { font-size: 0.88rem; }
      .character-info p { font-size: 0.75rem; }
    }

    /* =========================
       CREATE PAGE — create-menu
    ========================= */
    /* +create トグルボタン */
    .create-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        max-width: 420px;
        margin: 0 auto 16px;
        padding: 12px 16px;
        border: 1.5px dashed var(--accent);
        border-radius: 12px;
        background: transparent;
        color: var(--accent);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s var(--ease);
        -webkit-tap-highlight-color: transparent;
    }

    .create-toggle svg {
        width: 20px;
        height: 20px;
        transition: transform 0.3s var(--ease);
    }

    .create-toggle:hover {
        background: var(--bg-elevated);
        transform: translateY(-1px);
    }

    .create-toggle:active {
        transform: scale(0.98);
    }

    .create-toggle.open svg {
        transform: rotate(45deg);
    }

    /* create-menu — スライド式 */
    .create-menu {
        display: flex;
        gap: 10px;
        list-style: none;
        padding: 0;
        margin-bottom: 28px;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transform: translateY(-8px);
        transition: max-height 0.35s var(--ease), opacity 0.25s var(--ease), transform 0.3s var(--ease), margin-bottom 0.3s var(--ease);
    }

    .create-menu.open {
        max-height: 200px;
        opacity: 1;
        transform: translateY(0);
        margin-bottom: 28px;
    }

    .create-menu:not(.open) {
        margin-bottom: 0;
    }

    .create-menu li a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 10px 18px;
        border-radius: 12px;
        border: 1.5px solid var(--border);
        background: var(--bg-elevated);
        color: var(--text);
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 600;
        transition: all 0.2s var(--ease);
        -webkit-tap-highlight-color: transparent;
    }

    .create-menu li a:hover {
        border-color: var(--accent);
        color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 4px 14px rgba(91, 141, 239, 0.12);
    }

    .create-menu li a:active {
        transform: translateY(0) scale(0.97);
    }

    /* =========================
       CREATE PAGE — filter
    ========================= */
    .filter {
        display: flex;
        gap: 8px;
        list-style: none;
        margin-bottom: 20px;
    }

    .filter li a {
        display: inline-block;
        padding: 7px 16px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text-secondary);
        font-size: 0.82rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s var(--ease);
        -webkit-tap-highlight-color: transparent;
    }

    .filter li a:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .filter li a.active {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
    }

    body.dark .filter li a.active {
        color: #0d0d0f;
    }

    /* =========================
       CREATE PAGE — item-list (Libraryリスト行UI準拠, 2026-10-08)
       シェル側idと被らないよう cr* 接頭辞。.item-listはcreateページ専用id
    ========================= */
    .item-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
    }

    .item-list > li { width: 100%; max-width: 420px; }

    .cr-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        cursor: pointer;
        text-align: left;
        text-decoration: none;
        color: var(--text);
        width: 100%;
        box-sizing: border-box;
        transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
        opacity: 0;
        transform: translateY(10px);
        animation: cr-row-in 0.35s var(--ease) forwards;
        animation-delay: calc(var(--row-index, 0) * 60ms);
    }
    @keyframes cr-row-in {
        to { opacity: 1; transform: translateY(0); }
    }
    .cr-row:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px var(--shadow);
        border-color: var(--accent);
    }
    .cr-row:active { transform: translateY(0) scale(0.995); }
    .cr-row:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
    }
    .cr-row:focus:not(:focus-visible) { outline: none; }

    .cr-thumb {
        width: 52px;
        height: 52px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--border), var(--bg-elevated));
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        font-size: 1.3rem;
        font-weight: 700;
        text-transform: uppercase;
    }
    .cr-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .cr-row-info {
        flex: 1;
        min-width: 0;
    }
    .cr-row-name {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .cr-kind {
        display: inline-block;
        flex-shrink: 0;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--border);
        color: var(--text-secondary);
        text-transform: uppercase;
    }
    .cr-kind.k-pack { background: var(--accent); color: #fff; }

    /* 公開状態バッジ */
    .cr-vis {
        display: inline-block;
        flex-shrink: 0;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        background: transparent;
    }
    .cr-vis.v-public { color: var(--accent); border-color: var(--accent); }
    .cr-vis.v-packonly { color: #b08de0; border-color: #b08de0; }

    .cr-row-dates {
        font-size: 0.72rem;
        color: var(--text-secondary);
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
    }

    .cr-menu-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text-secondary);
        padding: 4px 8px;
        margin: -4px -6px;
        border-radius: 8px;
        flex-shrink: 0;
        transition: color 0.2s var(--ease), background 0.2s var(--ease);
    }
    .cr-menu-btn:hover { color: var(--text); background: var(--border); }

    /* ローディングスケルトン */
    .item-skeleton {
        height: 76px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: linear-gradient(90deg, var(--border) 25%, var(--bg-elevated) 50%, var(--border) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
    }

    /* 空状態 */
    .cr-state {
        width: 100%;
        max-width: 420px;
        text-align: center;
        color: var(--text-secondary);
        padding: 40px 0;
        font-size: 0.9rem;
        line-height: 1.8;
    }
    .cr-state .state-emoji { font-size: 2rem; display: block; margin-bottom: 8px; }

    /* ···メニューのボトムシート (lib-popup準拠) */
    .cr-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1001;
    }
    .cr-backdrop.active { display: block; }
    .cr-popup {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--bg-elevated);
        border-top: 1px solid var(--border);
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -4px 16px var(--shadow);
        z-index: 1002;
        animation: cr-slideup 0.3s var(--ease) forwards;
    }
    .cr-popup.active { display: block; }
    @keyframes cr-slideup {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }
    .cr-popup-content {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 480px;
        margin: 0 auto;
    }
    .cr-popup-title {
        font-size: 0.82rem;
        font-weight: 700;
        color: var(--text-secondary);
        text-align: center;
        padding: 4px 0 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .cr-popup-item {
        padding: 13px 16px;
        border-radius: 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text);
        text-align: left;
        width: 100%;
        box-sizing: border-box;
        font-family: inherit;
        text-decoration: none;
        transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
    }
    .cr-popup-item:hover { border-color: var(--accent); }
    .cr-popup-item.danger { color: #c23b41; }
    .cr-popup-item.danger:hover { border-color: #c23b41; }

    /* 小さい画面 */
    @media (max-width: 480px) {
      .cr-thumb { width: 44px; height: 44px; }
      .cr-row { padding: 10px 12px; gap: 10px; }
    }

    /* 20件ブロック読み込みの「もっと見る」 */
    .load-more { display: flex; justify-content: center; padding: 8px 0; }
    .load-more button {
      font-family: inherit; font-size: 0.85rem; cursor: pointer;
      padding: 10px 28px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--bg-elevated);
      color: var(--text-primary); transition: all 0.2s var(--ease);
    }
    .load-more button:hover { border-color: var(--accent); transform: translateY(-1px); }
  </style>
</head>

<body>
<script src="/assets/js/darkmode-early.js"></script>
<script src="/common.js"></script>

  <!-- HEADER / OVERLAY / SLIDE MENU は common.js が注入する (Issue #9) -->

  <main class="main">
    <div class="main-inner">
        <h2>Create</h2>
        <!-- ※ main-inner直下は上から: toggle → menu → filter → list (JSは既存idをそのまま使用) -->
        <button class="create-toggle" id="createToggle" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            create
        </button>
        <ul class="create-menu" id="createMenu">
            <li><a href="/create/character/">character</a></li>
            <li><a href="/create/scene/">scene</a></li>
            <li><a href="/create/rag/">RAG</a></li>
            <li><a href="/create/pack/">pack</a></li>
        </ul>
        <ul class="filter" id="filter">
            <li><a href="#c" data-type="character" class="active">character</a></li>
            <li><a href="#s" data-type="scene">scene</a></li>
            <li><a href="#r" data-type="rag">RAG</a></li>
            <li><a href="#p" data-type="pack">pack</a></li>
        </ul>
        <ul class="item-list" id="itemList">
            <!-- 動的に生成 -->
        </ul>
    </div>
  </main>

  <!-- ···メニュー (ボトムシート)。idはcr*接頭辞でシェル13idと衝突回避 -->
  <div class="cr-backdrop" id="crBackdrop"></div>
  <div class="cr-popup" id="crPopup" role="dialog" aria-modal="true">
    <div class="cr-popup-content">
      <p class="cr-popup-title" id="crPopupTitle"></p>
      <div id="crPopupActions"></div>
    </div>
  </div>

<script src="/assets/js/page-create.js?v=20261008"></script>
</body>
</html>
