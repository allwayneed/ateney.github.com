<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/config.js"></script>
  <title>ateney</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --bg-elevated: #f5f5f7;
      --text: #1a1a1a;
      --text-secondary: #6e6e73;
      --border: #d1d1d6;
      --shadow: rgba(0, 0, 0, 0.08);
      --accent: #5b8def;
      --danger: #ff4757;

      --header-h: 60px;
      --menu-w: 280px;

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition: 0.35s var(--ease);
    }

    body.dark {
      --bg: #0d0d0f;
      --bg-elevated: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --border: #38383a;
      --shadow: rgba(0, 0, 0, 0.4);
      --accent: #7c9fff;
      --danger: #ff6b7a;
    }

    body {
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }

    /* VIEW TRANSITIONS */

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) { z-index: 9999; }

    /* HEADER */

    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 90;
      transition: background var(--transition), border-color var(--transition);
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      user-select: none;
      cursor: default;
    }

    .logo span {
      display: inline-block;
      transition: transform 0.4s var(--ease-spring), color 0.3s var(--ease);
    }

    .logo:hover span { animation: logo-wave 0.8s var(--ease); }

    @keyframes logo-wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .logo span:nth-child(1) { animation-delay: 0ms; }
    .logo span:nth-child(2) { animation-delay: 60ms; }
    .logo span:nth-child(3) { animation-delay: 120ms; }
    .logo span:nth-child(4) { animation-delay: 180ms; }
    .logo span:nth-child(5) { animation-delay: 240ms; }
    .logo span:nth-child(6) { animation-delay: 300ms; }

    /* =========================
       ACCOUNT BUTTON + DROPDOWN
    ========================= */

    .account {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: auto;
      margin-left: 20px;
    }

    .account-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: var(--bg-elevated);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    .account-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.15);
    }

    /* Login pill button (shows when not logged in) */
    .login-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), opacity 0.2s var(--ease);
    }

    body.dark .login-pill {
      color: #0d0d0f;
    }

    .login-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(91, 141, 239, 0.4);
    }

    .login-pill:active {
      transform: scale(0.97);
    }

    .login-pill svg {
      width: 16px;
      height: 16px;
    }

    .account-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Account dropdown — にょきって出てくる */
    .account-menu {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      width: 240px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 40px var(--shadow);
      overflow: hidden;
      z-index: 95;

      opacity: 0;
      transform: translateY(-12px) scale(0.96);
      transform-origin: top left;
      pointer-events: none;
      transition:
        opacity 0.25s var(--ease),
        transform 0.3s var(--ease-spring);
    }

    .account-menu.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* User header inside dropdown */
    .account-menu-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .account-menu-header .avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .account-menu-header .avatar-sm svg {
      width: 18px;
      height: 18px;
    }

    .account-menu-header .user-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .account-menu-header .user-id {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* Menu items */
    .account-menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s var(--ease), padding-left 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    .account-menu a:last-child {
      border-bottom: none;
    }

    .account-menu a:hover {
      background: var(--bg-elevated);
      padding-left: 22px;
    }

    .account-menu a svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.55;
      transition: opacity 0.2s var(--ease);
    }

    .account-menu a:hover svg {
      opacity: 0.85;
    }

    .account-menu a.logout {
      color: var(--danger);
    }

    .account-menu a.logout svg {
      opacity: 0.7;
    }

    /* Badge for notifications */
    .badge {
      margin-left: auto;
      background: var(--accent);
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    body.dark .badge {
      color: #0d0d0f;
    }

    /* HEADER ACTIONS */

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ICON BUTTONS + ripple */

    .icon-btn {
      position: relative;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text);
      border-radius: 50%;
      transition: background 0.2s var(--ease), color var(--transition);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .icon-btn:active { background: var(--bg-elevated); }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.25;
      transform: translate(-50%, -50%) scale(0);
      animation: ripple-anim 0.6s var(--ease);
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
    }

    /* HAMBURGER */

    .menu-button .bars { position: relative; width: 22px; height: 16px; }

    .menu-button .bars span {
      display: block;
      position: absolute;
      left: 0;
      width: 100%;
      height: 2.5px;
      border-radius: 2px;
      background: currentColor;
      transition: transform 0.3s var(--ease), opacity 0.2s var(--ease);
    }

    .menu-button .bars span:nth-child(1) { top: 0; }
    .menu-button .bars span:nth-child(2) { top: 50%; transform: translateY(-50%); }
    .menu-button .bars span:nth-child(3) { bottom: 0; }

    .menu-button.open .bars span:nth-child(1) { transform: translateY(6.75px) rotate(45deg); }
    .menu-button.open .bars span:nth-child(2) { opacity: 0; }
    .menu-button.open .bars span:nth-child(3) { transform: translateY(-6.75px) rotate(-45deg); }

    /* DARK MODE TOGGLE */

    .darkmode { overflow: visible; }
    .darkmode .toggle-track { position: relative; width: 26px; height: 26px; }
    .darkmode .sun-core {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: currentColor; transform: translate(-50%, -50%);
      transition: all 0.4s var(--ease);
    }
    .darkmode .moon-cover {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--bg);
      transform: translate(-50%, -50%) translateX(0);
      opacity: 0;
      transition: opacity 0.4s var(--ease), background var(--transition), transform 0.4s var(--ease);
    }
    .darkmode .rays {
      position: absolute; top: 50%; left: 50%;
      width: 26px; height: 26px;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s var(--ease);
      animation: rays-spin 20s linear infinite;
    }
    @keyframes rays-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .darkmode .rays span {
      position: absolute; top: 0; left: 50%;
      width: 2px; height: 5px; border-radius: 2px;
      background: currentColor;
      transform-origin: 50% 13px;
      transform: translateX(-50%) rotate(calc(var(--i) * 45deg));
      transition: height 0.3s var(--ease), opacity 0.3s var(--ease);
    }
    .darkmode.active .rays { animation-play-state: paused; }
    .darkmode.active .rays span { height: 0; opacity: 0; }
    .darkmode.active .moon-cover {
      opacity: 1;
      transform: translate(-50%, -50%) translateX(5px) translateY(-2px);
    }

    /* SLIDE MENU */

    .menu {
      position: fixed; top: 0; right: 0;
      width: var(--menu-w); height: 100vh; max-width: 85vw;
      background: var(--bg);
      border-left: 1px solid var(--border);
      padding: calc(var(--header-h) + 24px) 0 0 0;
      transform: translateX(100%);
      transition: transform 0.35s var(--ease), background var(--transition), border-color var(--transition);
      box-shadow: -8px 0 32px var(--shadow);
      z-index: 80;
      overflow-y: auto;
    }
    .menu.open { transform: translateX(0); }

    .menu a {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 28px;
      color: var(--text); text-decoration: none;
      font-size: 0.95rem; font-weight: 500;
      border-bottom: 1px solid var(--border);
      opacity: 0; transform: translateX(30px);
      transition: background 0.2s var(--ease), color var(--transition),
                  border-color var(--transition), transform 0.3s var(--ease),
                  opacity 0.3s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .menu.open a { animation: menu-item-in 0.4s var(--ease) forwards; }
    .menu.open a:nth-child(1) { animation-delay: 60ms; }
    .menu.open a:nth-child(2) { animation-delay: 105ms; }
    .menu.open a:nth-child(3) { animation-delay: 150ms; }
    .menu.open a:nth-child(4) { animation-delay: 195ms; }
    .menu.open a:nth-child(5) { animation-delay: 240ms; }
    .menu.open a:nth-child(6) { animation-delay: 285ms; }
    .menu.open a:nth-child(7) { animation-delay: 330ms; }
    .menu.open a:nth-child(8) { animation-delay: 375ms; }
.menu.open a:nth-child(9) { animation-delay: 420ms; }
.menu.open a:nth-child(10) { animation-delay: 465ms; }
    @keyframes menu-item-in { to { opacity: 1; transform: translateX(0); } }

    .menu a:hover { background: var(--bg-elevated); padding-left: 34px; }
    .menu a:active { background: var(--border); }

    .menu a .menu-icon {
      width: 20px; height: 20px; flex-shrink: 0; opacity: 0.6;
      transition: transform 0.4s var(--ease-spring), opacity 0.2s var(--ease);
    }
    .menu a:hover .menu-icon { transform: scale(1.25) rotate(-8deg); opacity: 0.9; }

    /* OVERLAY */

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0; pointer-events: none; z-index: 70;
      transition: opacity 0.35s var(--ease);
      backdrop-filter: blur(2px);
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    /* MAIN CONTENT */

    .main {
      padding-top: var(--header-h);
      min-height: 100vh;
    }

    .main-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px;
      animation: fade-up 0.6s var(--ease) both;
      animation-delay: 0.1s;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .main h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }

    .main > .main-inner > p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    /* CHARACTER GRID */

    #character-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .character-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-elevated);
      cursor: pointer;

      opacity: 0;
      transform: translateY(20px) scale(0.97);
      animation: card-in 0.5s var(--ease) forwards;

      transition:
        transform 0.3s var(--ease),
        box-shadow 0.3s var(--ease),
        border-color 0.3s var(--ease);
    }

    @keyframes card-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .character-card { animation-delay: calc(var(--card-index, 0) * 70ms); }

    .character-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px var(--shadow);
      border-color: var(--accent);
    }

    .character-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .character-card .card-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--border);
    }

    .character-card .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--ease);
    }

    .character-card:hover .card-image img {
      transform: scale(1.08);
    }

    .card-image-fallback {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 2.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .character-info {
      padding: 14px 16px;
    }

    .character-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px;
      color: var(--text);
    }

    .character-info p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* SKELETON LOADING */

    .skeleton-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-elevated);
    }

    .skeleton-card .skel-img,
    .skeleton-card .skel-line {
      background: linear-gradient(
        90deg,
        var(--border) 25%,
        var(--bg-elevated) 50%,
        var(--border) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    .skeleton-card .skel-img {
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .skeleton-card .skel-body { padding: 14px 16px; }

    .skeleton-card .skel-line {
      height: 12px; border-radius: 6px; margin-bottom: 8px;
    }

    .skeleton-card .skel-line.short { width: 60%; }

    /* EMPTY / ERROR STATE */

    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .state-msg .state-emoji {
      font-size: 2rem;
      display: block;
      margin-bottom: 10px;
      animation: bob 2s var(--ease) infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* =========================
       RESPONSIVE — スマホ対応
    ========================= */

    /* タブレット以下 (768px) */
    @media (max-width: 768px) {
      .header { padding: 0 12px; }
      .logo { font-size: 1.15rem; }
      .account { margin-left: 12px; gap: 6px; }
      .login-pill { font-size: 0.78rem; padding: 6px 10px; }
      .login-pill svg { width: 14px; height: 14px; }
      .icon-btn { width: 38px; height: 38px; }
      .account-btn { width: 34px; height: 34px; }
      .header-actions { gap: 4px; }
    }

    /* スマホ (480px) */
    @media (max-width: 480px) {
      .header { padding: 0 10px; }
      .logo { font-size: 1.05rem; }
      .account { margin-left: 8px; gap: 4px; }
      .login-pill { font-size: 0.72rem; padding: 5px 8px; gap: 4px; }
      .login-pill svg { width: 13px; height: 13px; }
      .icon-btn { width: 36px; height: 36px; }
      .account-btn { width: 32px; height: 32px; }
      .header-actions { gap: 2px; }
      .main-inner { padding: 24px 14px; }
    }

    /* 極小画面 (360px) — ログインpillをアイコンのみに */
    @media (max-width: 360px) {
      .login-pill { padding: 6px; }
      .login-pill svg { width: 14px; height: 14px; }
      .login-pill-text { display: none; }
      .logo { font-size: 0.95rem; }
    }

    /* カードグリッド */
    @media (max-width: 768px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }
    }
    @media (max-width: 480px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
    }
    @media (max-width: 360px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 8px;
      }
      .character-info { padding: 10px 12px; }
      .character-info h3 { font-size: 0.88rem; }
      .character-info p { font-size: 0.75rem; }
    }

    /* REDUCED MOTION */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <h1 class="logo" id="logo">
      <span>a</span><span>t</span><span>e</span><span>n</span><span>e</span><span>y</span>
    </h1>

    <!-- ACCOUNT -->
    <div class="account" id="account">
      <button class="account-btn" id="accountButton" aria-label="アカウント">
        <svg id="accountAvatar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
        </svg>
      </button>

      <a href="/login/" class="login-pill" id="loginPill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span class="login-pill-text">ログイン</span>
      </a>

      <!-- DROPDOWN -->
      <div class="account-menu" id="accountMenu">
        <!-- 動的に生成 -->
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn darkmode" id="darkmodeButton" aria-label="ダークモード切替">
        <div class="toggle-track">
          <div class="rays">
            <span style="--i: 0"></span><span style="--i: 1"></span>
            <span style="--i: 2"></span><span style="--i: 3"></span>
            <span style="--i: 4"></span><span style="--i: 5"></span>
            <span style="--i: 6"></span><span style="--i: 7"></span>
          </div>
          <div class="sun-core"></div>
          <div class="moon-cover"></div>
        </div>
      </button>

      <button class="icon-btn menu-button" id="menuButton" aria-label="メニュー">
        <div class="bars"><span></span><span></span><span></span></div>
      </button>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>

  <!-- SLIDE MENU -->
  <nav class="menu" id="menu">
    <a href="/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>

    </a>
    <a href="/scene/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="5.5" r="2.5"/>
        <path d="M2 16c1.2 0 1.2-1.2 2.4-1.2S5.6 16 6.8 16 8 14.8 9.2 14.8 10.4 16 11.6 16s1.2-1.2 2.4-1.2S15.2 16 16.4 16s1.2-1.2 2.4-1.2S20 16 21.2 16"/>
        <path d="M2 21c1.2 0 1.2-1.2 2.4-1.2S5.6 21 6.8 21 8 19.8 9.2 19.8 10.4 21 11.6 21s1.2-1.2 2.4-1.2S15.2 21 16.4 21s1.2-1.2 2.4-1.2S20 21 21.2 21"/>
      </svg>

    <a href="/rag/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="1"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <path d="M6 12V6"/>
        <path d="M9 12V4.5"/>
        <path d="M12 12V7"/>

        <path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/>

      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="main-inner">
        <h2>Create</h2>
        <ul class="create-menu">
            <li><a href="/create/character/">character</a></li>
            <li><a href="/create/scene/">scene</a></li>
            <li><a href="/create/rag/">RAG</a></li>
        </ul>
        <ul class="filter" id="filter">
            <li><a href="#c" data-type="character" class="active">character</a></li>
            <li><a href="#s" data-type="scene">scene</a></li>
            <li><a href="#r" data-type="rag">RAG</a></li>
        </ul>

        <!-- 作ったアイテム一覧 -->
        <ul class="item-list" id="itemList">
            <!-- 動的に生成される -->
        </ul>
    </div>
  </main>

  <script>
    /* =========================
       HAMBURGER + OVERLAY
    ========================= */
    const menuButton = document.getElementById("menuButton");
    const menu = document.getElementById("menu");
    const overlay = document.getElementById("overlay");

    function toggleMenu(force) {
      const open = force !== undefined ? force : !menu.classList.contains("open");
      menuButton.classList.toggle("open", open);
      menu.classList.toggle("open", open);
      overlay.classList.toggle("show", open);
    }

    menuButton.addEventListener("click", () => toggleMenu());
    overlay.addEventListener("click", () => toggleMenu(false));

    /* =========================
       AUTH CHECK + ACCOUNT DROPDOWN
    ========================= */
    const accountButton = document.getElementById("accountButton");
    const accountMenu = document.getElementById("accountMenu");

    // --- Auth state ---
    function getAuthUser() {
      try {
        const raw = localStorage.getItem("ateney-user");
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      // Also check for just a token
      if (localStorage.getItem("ateney-token")) {
        return { name: "ユーザー", id: "ログイン中" };
      }
      return null;
    }

    const authUser = getAuthUser();
    const loginPill = document.getElementById("loginPill");

    // --- Hide login pill if logged in ---
    if (authUser) {
      loginPill.style.display = "none";
    }

    // --- Build account menu based on auth state ---
    function buildAccountMenu() {
      if (authUser) {
        // Logged in
        // ユーザー名・IDは信頼できない値のため、innerHTMLではなくtextContentで挿入する（XSS対策）。
        // 静的なメニュー構造のみinnerHTMLで組み立て、動的値は後から個別にセットする。
        accountMenu.innerHTML = `
          <div class="account-menu-header">
            <div class="avatar-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
              </svg>
            </div>
            <div>
              <div class="user-name" id="menuUserName"></div>
              <div class="user-id" id="menuUserId"></div>
            </div>
          </div>
          <a href="/profile/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
            プロフィール
          </a>
          <a href="/notifications/" id="notificationsLink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            通知
          </a>
          <a href="/account-settings/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            アカウント設定
          </a>
          <a href="/help/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            ヘルプ
          </a>
          <a href="/logout/" class="logout" id="logoutBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            ログアウト
          </a>
        `;

        // 動的値はtextContentで安全に挿入（HTMLとして解釈されない）
        document.getElementById("menuUserName").textContent = authUser.name || "ユーザー";
        document.getElementById("menuUserId").textContent = authUser.id || "";

        // 通知バッジ: 未実装のため常時「3」を表示していた（ダミー値）。
        // 実データ連携までは非表示にする。
        // TODO: 実際の未読通知数をAPIから取得してここに反映する。

        // Logout handler — clear auth and redirect
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", (e) => {
            e.preventDefault();
            localStorage.removeItem("ateney-user");
            localStorage.removeItem("ateney-token");
            window.location.href = "/login/";
          });
        }
      } else {
        // Not logged in — show login button instead of logout
        accountMenu.innerHTML = `
          <div class="account-menu-header">
            <div class="avatar-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
              </svg>
            </div>
            <div>
              <div class="user-name">ゲスト</div>
              <div class="user-id">未ログイン</div>
            </div>
          </div>
          <a href="/login/" class="login-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            ログイン
          </a>
        `;
      }
    }

    buildAccountMenu();

    // --- Dropdown toggle ---
    function toggleAccount(force) {
      const open = force !== undefined ? force : !accountMenu.classList.contains("open");
      accountMenu.classList.toggle("open", open);
    }

    accountButton.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleAccount();
    });

    // Close when clicking outside
    document.addEventListener("click", (e) => {
      if (!accountMenu.contains(e.target) && e.target !== accountButton) {
        toggleAccount(false);
      }
    });

    // Close on Escape
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        toggleAccount(false);
        toggleMenu(false);
      }
    });

    /* =========================
       RIPPLE EFFECT
    ========================= */
    document.querySelectorAll(".icon-btn").forEach(btn => {
      btn.addEventListener("pointerdown", (e) => {
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.left = (e.clientX - rect.left) + "px";
        ripple.style.top = (e.clientY - rect.top) + "px";
        ripple.style.width = "60px";
        ripple.style.height = "60px";
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });

    /* =========================
       DARK MODE (circular reveal + persistence)
    ========================= */
    const darkmodeButton = document.getElementById("darkmodeButton");

    function applyDarkMode(on) {
      document.body.classList.toggle("dark", on);
      darkmodeButton.classList.toggle("active", on);
    }

    function toggleDarkMode() {
      const isDark = !document.body.classList.contains("dark");
      const rect = darkmodeButton.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      if (document.startViewTransition) {
        const transition = document.startViewTransition(() => {
          applyDarkMode(isDark);
        });
        transition.ready.then(() => {
          document.documentElement.animate(
            {
              clipPath: [
                `circle(0% at ${cx}px ${cy}px)`,
                `circle(150% at ${cx}px ${cy}px)`
              ]
            },
            {
              duration: 500,
              easing: "cubic-bezier(0.4, 0, 0.2, 1)",
              pseudoElement: "::view-transition-new(root)"
            }
          );
        });
      } else {
        applyDarkMode(isDark);
      }

      try { localStorage.setItem("ateney-dark", isDark ? "1" : "0"); } catch (e) {}
    }

    try {
      const saved = localStorage.getItem("ateney-dark");
      if (saved === "1") applyDarkMode(true);
    } catch (e) {}

    darkmodeButton.addEventListener("click", toggleDarkMode);

    /* =========================
       LOGO: re-trigger animation
    ========================= */
    const logo = document.getElementById("logo");
    logo.addEventListener("mouseenter", () => {
      logo.querySelectorAll("span").forEach(s => {
        s.style.animation = "none";
        void s.offsetWidth;
        s.style.animation = "";
      });
    });

    /* =========================
       CREATE — フィルター + アイテム一覧
       作ったキャラ/シーン/RAGを箇条書きで表示する君。
       フィルター切り替えるたびにAPI叩いて一覧を更新する仕様。
    ========================= */
    var cfg = window.ATENEY_CONFIG || {};
    var apiBase = cfg.API_BASE || "https://ateney-api.ateney-ai.workers.dev";

    var filterTabs = document.querySelectorAll("#filter a");
    var itemList = document.getElementById("itemList");
    var currentType = "character";

    // --- フィルター切り替え ---
    filterTabs.forEach(function(tab) {
      tab.addEventListener("click", function(e) {
        e.preventDefault();
        filterTabs.forEach(function(t) { t.classList.remove("active"); });
        tab.classList.add("active");
        currentType = tab.getAttribute("data-type");
        loadItems(currentType);
      });
    });

    // --- 認証トークン取得 ---
    function getAuthHeaders() {
      var token = localStorage.getItem("ateney-token");
      if (token) {
        return { "Authorization": "Bearer " + token };
      }
      return {};
    }

    // --- アイテム読み込み ---
    function loadItems(type) {
      // スケルトン表示（ロード中）
      var skel = "";
      for (var i = 0; i < 4; i++) {
        skel += '<li><div class="item-skeleton"></div></li>';
      }
      itemList.innerHTML = skel;

      var endpoint = apiBase + "/api/" + type;

      fetch(endpoint, { headers: getAuthHeaders() })
        .then(function(res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function(data) {
          // レスポンスの形がバラバラなので正規化する（カオスを秩序へ）
          var items = [];
          if (type === "character") {
            items = data.characters || data.items || data || [];
          } else if (type === "scene") {
            items = data.scenes || data.items || data || [];
          } else if (type === "rag") {
            items = data.documents || data.items || data || [];
          }

          if (!Array.isArray(items) || items.length === 0) {
            itemList.innerHTML = '<li style="color: var(--text-secondary); padding: 24px 0; text-align: center; font-size: 0.88rem;">まだ何も作ってないよ。上のリンクから作ってみよう ✨</li>';
            return;
          }

          renderItems(items, type);
        })
        .catch(function(err) {
          console.error("Failed to load items:", err);
          itemList.innerHTML = '<li style="color: var(--text-secondary); padding: 24px 0; text-align: center; font-size: 0.88rem;">読み込めなかった。APIが寝てるかも… 😴</li>';
        });
    }

    // --- アイテム描画（箇条書きボタン） ---
    function renderItems(items, type) {
      itemList.innerHTML = "";

      items.forEach(function(item, i) {
        var li = document.createElement("li");

        var link = document.createElement("a");
        link.href = "/" + type + "/" + (item.id || item.uuid || "") + "/";

        // サムネイル
        var thumb = document.createElement("div");
        thumb.className = "item-thumb";

        if (item.avatar_url || item.image_url) {
          var img = document.createElement("img");
          img.src = item.avatar_url || item.image_url;
          img.alt = item.name || item.title || "";
          img.loading = "lazy";
          img.addEventListener("error", function() {
            thumb.innerHTML = "";
            thumb.textContent = (item.name || item.title || "?").charAt(0).toUpperCase();
          });
          thumb.appendChild(img);
        } else {
          thumb.textContent = (item.name || item.title || "?").charAt(0).toUpperCase();
        }

        // 名前
        var name = document.createElement("span");
        name.className = "item-name";
        name.textContent = item.name || item.title || "Untitled";

        // タイプラベル
        var typeLabel = document.createElement("span");
        typeLabel.className = "item-type";
        typeLabel.textContent = type;

        link.appendChild(thumb);
        link.appendChild(name);
        link.appendChild(typeLabel);

        // カード入場アニメ用の遅延
        link.style.opacity = "0";
        link.style.transform = "translateY(10px)";
        link.style.transition = "opacity 0.3s var(--ease), transform 0.3s var(--ease)";
        setTimeout(function() {
          link.style.opacity = "1";
          link.style.transform = "translateY(0)";
        }, i * 50);

        li.appendChild(link);
        itemList.appendChild(li);
      });
    }

    // 初期読み込み — characterタブで開始
    loadItems("character");
  </script>
</body>
