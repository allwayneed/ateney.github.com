<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <!-- CSP: XSS時の被害を縮小する。スクリプトはすべて外部ファイル (script-src 'self' のみ)。
       インラインscriptはCSPで完全拒否されるため、新規JSは必ず assets/js/ に置くこと。
       connect-src の workers.dev は ateney-api のホスト。Worker移転時はここも更新。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://*.ateney-ai.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="シーンを作成・編集する">
  <meta name="robots" content="noindex">

  <title>Create scene - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">

  <script src="/config.js"></script>
  <script src="/auth.js"></script>

  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/create/create.css">
</head>

<body>
<script src="/assets/js/darkmode-early.js"></script>
<script src="/common.js"></script>

  <!-- HEADER / OVERLAY / SLIDE MENU は common.js が注入する -->

  <main class="main">
    <div class="main-inner">
      <h2 id="pageTitle">scene を作る</h2>

      <form id="editorForm" class="editor-form" novalidate>
        <div class="field">
          <label for="f-name">名前 (必須)</label>
          <input type="text" id="f-name" name="name" maxlength="100" required autocomplete="off">
        </div>
        <div class="field">
          <label for="f-description">説明</label>
          <textarea id="f-description" name="description" maxlength="20000" placeholder="このシーンの紹介"></textarea>
        </div>
        <div class="field">
          <label for="f-setting">設定 (setting)</label>
          <textarea id="f-setting" name="setting" maxlength="20000" placeholder="舞台・時間帯・状況など"></textarea>
        </div>
        <div class="field">
          <label for="f-tags">タグ</label>
          <input type="text" id="f-tags" name="tags" maxlength="200" placeholder="カンマ区切り" autocomplete="off">
        </div>
        <div class="field">
          <label for="f-genre">ジャンル</label>
          <input type="text" id="f-genre" name="genre" maxlength="100" autocomplete="off">
        </div>
        <div class="field">
          <label class="check-row"><input type="checkbox" name="is_public"> 公開する</label>
        </div>
        <p class="status" id="status"></p>
        <div class="form-actions">
          <a class="btn" href="/create/">戻る</a>
          <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
          <button type="button" class="btn btn-danger" id="deleteBtn" hidden>削除</button>
        </div>
      </form>
    </div>
  </main>

<script src="/assets/js/page-create-scene.js"></script>
</body>
</html>
