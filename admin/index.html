<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ACCESS DENIED</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <style>
    /* いたずらページ。雰囲気を出すためだけの黒い端末。実データの取得は一切していない。 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #33ff66;
      font-family: "Courier New", Courier, monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .terminal {
      width: 100%;
      max-width: 640px;
      border: 1px solid #1d3a24;
      background: #0d0f0d;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(51, 255, 102, 0.08);
    }

    .term-bar {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      background: #131613;
      border-bottom: 1px solid #1d3a24;
    }

    .term-bar span {
      width: 10px; height: 10px; border-radius: 50%;
      background: #1d3a24;
    }

    .term-body {
      padding: 20px 22px 28px;
      font-size: 0.85rem;
      line-height: 1.8;
      letter-spacing: 0.04em;
    }

    .line { white-space: pre-wrap; word-break: break-all; }

    .red { color: #ff4757; }
    .dim { color: #1f7a3d; }
    .yellow { color: #ffd32a; }

    .cursor {
      display: inline-block;
      width: 8px; height: 15px;
      background: #33ff66;
      vertical-align: -2px;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .reveal {
      display: none;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px dashed #1d3a24;
      font-size: 0.82rem;
      line-height: 2;
    }

    .reveal a {
      color: #ffd32a;
      text-decoration: underline;
    }

    .stamp {
      margin-top: 14px;
      display: inline-block;
      border: 1px solid #1d3a24;
      padding: 2px 10px;
      font-size: 0.72rem;
      color: #1f7a3d;
    }
  </style>
</head>
<body>
  <div class="terminal" role="main">
    <div class="term-bar"><span></span><span></span><span></span></div>
    <div class="term-body" id="log">
      <div class="line reveal" id="reveal">
        <span class="yellow">…なんてね。</span>
        ここはダミーだよ。よく見つけたね、/admin/ なんて。
        でも ateney には管理者画面も管理者パスワードも存在しない。
        開発者は一人だけで、あとは API の向こうで働いてる AI が少しだけ。
        君の痕跡も何も記録してないし、もともと記録する物すら無い。

        もし本気で脆弱性を探してくれてるなら、それは嬉しい話だ。
        見つけたら教えてほしい → <a href="mailto:security@ateney.f5.si">security@ateney.f5.si</a>
        窓口は <a href="/.well-known/security.txt">/.well-known/security.txt</a> にも書いてある。

        <a href="/">← 表に戻る</a>
        <br><span class="stamp">ateney — prank page, nothing here</span>
      </div>
    </div>
  </div>

  <script>
    // ただの演出。fetch も location も何も触らない、文字を順に出すだけ。
    (function () {
      var lines = [
        { text: "> GET /admin/ -- attempting access...", cls: "dim" },
        { text: "[ !! ] UNAUTHORIZED CONNECTION DETECTED", cls: "red" },
        { text: "[ !! ] SECURITY LEVEL: OMEGA", cls: "red" },
        { text: "[ .. ] tracing origin...", cls: "" },
        { text: "[ .. ] isolating hostile entity...", cls: "" },
        { text: "[ OK ] entity classified: いたずら好きな君", cls: "yellow" },
        { text: "[ .. ] deploying countermeasure...", cls: "" }
      ];
      var log = document.getElementById("log");
      var reveal = document.getElementById("reveal");

      var i = 0;
      function nextLine() {
        if (i < lines.length) {
          var d = document.createElement("div");
          d.className = "line " + (lines[i].cls || "");
          log.insertBefore(d, reveal);
          var j = 0;
          (function type() {
            if (j < lines[i].text.length) {
              d.textContent = lines[i].text.slice(0, ++j);
              setTimeout(type, 14);
            } else {
              i++;
              setTimeout(nextLine, 260);
            }
          })();
        } else {
          reveal.style.display = "block";
        }
      }
      nextLine();
    })();
  </script>
</body>
</html>
