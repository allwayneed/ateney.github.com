<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>I watch you.</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <style>
    /* いたずらページ。前プロジェクトの血を引く「止まれ」方式。
       白背景に赤枠の逆三角形で I watch you. を出し、
       5秒後に不協和音のビープで強制的に / へ戻す。
       実データの取得は一切していない。外部通信も入力欄も無し。 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f6e4cf;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 28px;
      padding: 24px;
    }

    .sign {
      width: min(70vw, 340px);
      height: auto;
      /* 置物みたいに静かに見つめてくる揺れ */
      animation: stare 4s ease-in-out infinite;
    }

    @keyframes stare {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .caption {
      font-family: "Courier New", Courier, monospace;
      color: #999;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-align: center;
      line-height: 1.9;
    }

    .caption a { color: #b00; text-decoration: none; }

    .no-js-hide { display: none; }
  </style>
</head>
<body>
  <!-- 止まれ (道路標識方式・逆三角形・赤枠白地) -->
  <svg class="sign" viewBox="0 0 300 262" role="img" aria-label="I watch you. 止まれ">
    <polygon points="150,14 286,246 14,246"
             fill="#fff" stroke="#d70035" stroke-width="20" stroke-linejoin="round"/>
    <text x="150" y="152" text-anchor="middle" fill="#d70035"
          font-size="30" font-weight="700" font-family="'Courier New', monospace">I watch</text>
    <text x="150" y="196" text-anchor="middle" fill="#d70035"
          font-size="38" font-weight="700" font-family="'Courier New', monospace">YOU</text>
  </svg>

  <p class="caption">
    5秒後に強制送還されます。<br>
    本気で穴を探してるなら →
    <a href="mailto:security@ateney.f5.si">security@ateney.f5.si</a> /
    <a href="/.well-known/security.txt">security.txt</a>
  </p>

<script src="/assets/js/page-admin.js"></script>
</body>
</html>
