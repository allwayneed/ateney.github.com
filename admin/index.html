<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>I watch you.</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <style>
    /* いたずらページ。前プロジェクトの血を引く「止まれ」方式。
       白背景に赤枠の逆三角形で I watch you. を出し、
       5秒後に不協和音のビープで強制的に / へ戻す。
       実データの取得は一切していない。外部通信も入力欄も無し。 */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 28px;
      padding: 24px;
    }

    .sign {
      width: min(70vw, 340px);
      height: auto;
      /* 置物みたいに静かに見つめてくる揺れ */
      animation: stare 4s ease-in-out infinite;
    }

    @keyframes stare {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .caption {
      font-family: "Courier New", Courier, monospace;
      color: #999;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-align: center;
      line-height: 1.9;
    }

    .caption a { color: #b00; text-decoration: none; }

    .no-js-hide { display: none; }
  </style>
</head>
<body>
  <!-- 止まれ (道路標識方式・逆三角形・赤枠白地) -->
  <svg class="sign" viewBox="0 0 300 262" role="img" aria-label="I watch you. 止まれ">
    <polygon points="150,14 286,246 14,246"
             fill="#fff" stroke="#d70035" stroke-width="20" stroke-linejoin="round"/>
    <text x="150" y="152" text-anchor="middle" fill="#d70035"
          font-size="38" font-weight="700" font-family="'Courier New', monospace">I watch</text>
    <text x="150" y="196" text-anchor="middle" fill="#d70035"
          font-size="38" font-weight="700" font-family="'Courier New', monospace">you.</text>
  </svg>

  <p class="caption">
    5秒後に強制送還されます。<br>
    本気で穴を探してるなら →
    <a href="mailto:security@ateney.f5.si">security@ateney.f5.si</a> /
    <a href="/.well-known/security.txt">security.txt</a>
  </p>

  <script>
    (function () {
      /* 不協和音: 半音クラッシュ (440Hz / 466.16Hz) + その下のオクターブ。
         警報っぽさを出すため sawtooth で。 */
      var ctx = null;
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      } catch (e) {}

      // 自動再生ブロック対策: 何かしら操作されていれば音が出る
      ["pointerdown", "keydown", "touchstart"].forEach(function (ev) {
        document.addEventListener(ev, function () {
          if (ctx && ctx.state === "suspended") ctx.resume();
        }, { once: false });
      });

      function discordBeep() {
        if (!ctx || ctx.state !== "running") return;
        var t = ctx.currentTime;
        [440, 466.16, 233.08].forEach(function (f) {
          var o = ctx.createOscillator();
          var g = ctx.createGain();
          o.type = "sawtooth";
          o.frequency.value = f;
          g.gain.setValueAtTime(0.12, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
          o.connect(g);
          g.connect(ctx.destination);
          o.start(t);
          o.stop(t + 1.1);
        });
      }

      // 5秒後: 不協和音 → 強制的に / へ (replace なので戻るボタンでも戻れない)
      setTimeout(function () {
        discordBeep();
        setTimeout(function () {
          window.location.replace("/");
        }, 1000);
      }, 5000);
    })();
  </script>
</body>
</html>
