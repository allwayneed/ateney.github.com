<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- CSP: XSS時の被害を縮小する。スクリプトはすべて外部ファイル (script-src 'self' のみ)。
       インラインscriptはCSPで完全拒否されるため、新規JSは必ず assets/js/ に置くこと。
       connect-src の workers.dev は ateney-api のホスト。Worker移転時はここも更新。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://*.ateney-ai.workers.dev; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <script src="/config.js"></script>
    <link rel="stylesheet" href="/common.css">
  <style>
/* CHARACTER DETAIL */
    .char-detail { animation: fade-in 0.4s var(--ease) forwards; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .char-back {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px;
      color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 500;
    }
    .char-back:hover { text-decoration: underline; }

    .char-header { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 32px; }

    .char-avatar {
      width: 120px; height: 120px; border-radius: 20px; flex-shrink: 0;
      overflow: hidden; background: var(--bg-elevated);
      border: 1px solid var(--border);
    }
    .char-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .char-avatar-fallback {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 3rem; font-weight: 700; color: var(--text-secondary);
    }

    .char-title { flex: 1; min-width: 0; }
    .char-title h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .char-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .char-tag {
      padding: 4px 10px; border-radius: 12px; background: var(--bg-elevated);
      color: var(--text-secondary); font-size: 0.75rem; font-weight: 500;
    }

    .char-section { margin-bottom: 28px; }
    .char-section h2 { font-size: 1rem; font-weight: 700; margin-bottom: 10px; color: var(--text-secondary); }
    .char-section p { font-size: 0.95rem; line-height: 1.8; }

    /* =========================
       pack 詳細 (Library本実装 2026-10-08) — .pk-detail にスコープ
    ========================= */
    .pk-detail .pk-part-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0 4px;
    }
    .pk-detail .pk-part-avatar {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--border);
    }
    .pk-detail .pk-part-fallback {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 1.2rem;
      text-transform: uppercase;
    }
    .pk-detail .pk-part-name {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }
    .pk-detail .pk-part-body {
      margin: 8px 0 0;
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--text);
    }
    .pk-detail .pk-subtle { color: var(--text-secondary); }
    .pk-detail .pk-greeting {
      font-style: italic;
      color: var(--text-secondary);
      padding-left: 12px;
      border-left: 3px solid var(--border);
    }
    .pk-detail .pk-rag-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pk-detail .pk-rag-list li {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-elevated);
    }
    .pk-detail .pk-rag-title {
      margin: 0 0 4px;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }
    .pk-detail .pk-rag-excerpt {
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.5;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .char-chat-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border: none; border-radius: 12px;
      background: var(--accent); color: white; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .char-chat-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91,141,239,0.35); }
    .char-chat-btn:disabled { opacity: 0.5; pointer-events: none; }

    /* LOADING / ERROR */
    .loading-state, .error-state, .not-found {
      text-align: center; padding: 80px 20px;
    }
    .loading-spinner {
      width: 40px; height: 40px; margin: 0 auto 20px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p, .error-state p, .not-found p {
      color: var(--text-secondary); font-size: 0.95rem;
    }
    .not-found h1 { font-size: 3rem; font-weight: 800; margin-bottom: 12px; }
    .not-found a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .not-found a:hover { text-decoration: underline; }

  
  </style>
</head>
<body>
<script src="/assets/js/darkmode-early.js"></script>
<script src="/auth.js"></script>
  <script src="/common.js"></script>

  <!-- HEADER / OVERLAY / SLIDE MENU は common.js が注入する (Issue #9) -->

  <main class="main">
    <div class="main-inner" id="content">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p id="loading-text">キャラクターを呼んでいます...</p>
      </div>
    </div>
  </main>

<script src="/assets/js/pack-ui.js?v=20261009"></script>
<script src="/assets/js/page-404.js?v=20261009"></script>
</body>
</html>
