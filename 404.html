<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ateney</title>
  <script src="/config.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --bg-elevated: #f5f5f7;
      --text: #1a1a1a;
      --text-secondary: #6e6e73;
      --border: #d1d1d6;
      --shadow: rgba(0, 0, 0, 0.08);
      --accent: #5b8def;
      --danger: #ff4757;

      --header-h: 60px;
      --menu-w: 280px;

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition: 0.35s var(--ease);
    }

    body.dark {
      --bg: #0d0d0f;
      --bg-elevated: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --border: #38383a;
      --shadow: rgba(0, 0, 0, 0.4);
      --accent: #7c9fff;
      --danger: #ff6b7a;
    }

    body {
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }

    /* VIEW TRANSITIONS */

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) { z-index: 9999; }

    /* HEADER */

    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 90;
      transition: background var(--transition), border-color var(--transition);
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      user-select: none;
      cursor: default;
    }

    .logo span {
      display: inline-block;
      transition: transform 0.4s var(--ease-spring), color 0.3s var(--ease);
    }

    .logo:hover span { animation: logo-wave 0.8s var(--ease); }

    @keyframes logo-wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .logo span:nth-child(1) { animation-delay: 0ms; }
    .logo span:nth-child(2) { animation-delay: 60ms; }
    .logo span:nth-child(3) { animation-delay: 120ms; }
    .logo span:nth-child(4) { animation-delay: 180ms; }
    .logo span:nth-child(5) { animation-delay: 240ms; }
    .logo span:nth-child(6) { animation-delay: 300ms; }

    /* =========================
       ACCOUNT BUTTON + DROPDOWN
    ========================= */

    .account {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: auto;
      margin-left: 20px;
    }

    .account-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: var(--bg-elevated);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    .account-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91, 141, 239, 0.15);
    }

    /* Login pill button (shows when not logged in) */
    .login-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: 20px;
      background: var(--accent);
      color: white;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease), opacity 0.2s var(--ease);
    }

    body.dark .login-pill {
      color: #0d0d0f;
    }

    .login-pill:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(91, 141, 239, 0.4);
    }

    .login-pill:active {
      transform: scale(0.97);
    }

    .login-pill svg {
      width: 16px;
      height: 16px;
    }

    .account-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .account-btn svg {
      width: 20px;
      height: 20px;
    }

    /* Account dropdown — にょきって出てくる */
    .account-menu {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      width: 240px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 40px var(--shadow);
      overflow: hidden;
      z-index: 95;

      opacity: 0;
      transform: translateY(-12px) scale(0.96);
      transform-origin: top left;
      pointer-events: none;
      transition:
        opacity 0.25s var(--ease),
        transform 0.3s var(--ease-spring);
    }

    .account-menu.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    /* User header inside dropdown */
    .account-menu-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .account-menu-header .avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }

    .account-menu-header .avatar-sm svg {
      width: 18px;
      height: 18px;
    }

    .account-menu-header .user-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .account-menu-header .user-id {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* Menu items */
    .account-menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s var(--ease), padding-left 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    .account-menu a:last-child {
      border-bottom: none;
    }

    .account-menu a:hover {
      background: var(--bg-elevated);
      padding-left: 22px;
    }

    .account-menu a svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.55;
      transition: opacity 0.2s var(--ease);
    }

    .account-menu a:hover svg {
      opacity: 0.85;
    }

    .account-menu a.logout {
      color: var(--danger);
    }

    .account-menu a.logout svg {
      opacity: 0.7;
    }

    /* Badge for notifications */
    .badge {
      margin-left: auto;
      background: var(--accent);
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      min-width: 18px;
      height: 18px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    body.dark .badge {
      color: #0d0d0f;
    }

    /* HEADER ACTIONS */

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ICON BUTTONS + ripple */

    .icon-btn {
      position: relative;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text);
      border-radius: 50%;
      transition: background 0.2s var(--ease), color var(--transition);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .icon-btn:active { background: var(--bg-elevated); }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.25;
      transform: translate(-50%, -50%) scale(0);
      animation: ripple-anim 0.6s var(--ease);
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
    }

    /* HAMBURGER */

    .menu-button .bars { position: relative; width: 22px; height: 16px; }

    .menu-button .bars span {
      display: block;
      position: absolute;
      left: 0;
      width: 100%;
      height: 2.5px;
      border-radius: 2px;
      background: currentColor;
      transition: transform 0.3s var(--ease), opacity 0.2s var(--ease);
    }

    .menu-button .bars span:nth-child(1) { top: 0; }
    .menu-button .bars span:nth-child(2) { top: 50%; transform: translateY(-50%); }
    .menu-button .bars span:nth-child(3) { bottom: 0; }

    .menu-button.open .bars span:nth-child(1) { transform: translateY(6.75px) rotate(45deg); }
    .menu-button.open .bars span:nth-child(2) { opacity: 0; }
    .menu-button.open .bars span:nth-child(3) { transform: translateY(-6.75px) rotate(-45deg); }

    /* DARK MODE TOGGLE */

    .darkmode { overflow: visible; }
    .darkmode .toggle-track { position: relative; width: 26px; height: 26px; }
    .darkmode .sun-core {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: currentColor; transform: translate(-50%, -50%);
      transition: all 0.4s var(--ease);
    }
    .darkmode .moon-cover {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--bg);
      transform: translate(-50%, -50%) translateX(0);
      opacity: 0;
      transition: opacity 0.4s var(--ease), background var(--transition), transform 0.4s var(--ease);
    }
    .darkmode .rays {
      position: absolute; top: 50%; left: 50%;
      width: 26px; height: 26px;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s var(--ease);
      animation: rays-spin 20s linear infinite;
    }
    @keyframes rays-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .darkmode .rays span {
      position: absolute; top: 0; left: 50%;
      width: 2px; height: 5px; border-radius: 2px;
      background: currentColor;
      transform-origin: 50% 13px;
      transform: translateX(-50%) rotate(calc(var(--i) * 45deg));
      transition: height 0.3s var(--ease), opacity 0.3s var(--ease);
    }
    .darkmode.active .rays { animation-play-state: paused; }
    .darkmode.active .rays span { height: 0; opacity: 0; }
    .darkmode.active .moon-cover {
      opacity: 1;
      transform: translate(-50%, -50%) translateX(5px) translateY(-2px);
    }

    /* SLIDE MENU */

    .menu {
      position: fixed; top: 0; right: 0;
      width: var(--menu-w); height: 100vh; max-width: 85vw;
      background: var(--bg);
      border-left: 1px solid var(--border);
      padding: calc(var(--header-h) + 24px) 0 0 0;
      transform: translateX(100%);
      transition: transform 0.35s var(--ease), background var(--transition), border-color var(--transition);
      box-shadow: -8px 0 32px var(--shadow);
      z-index: 80;
      overflow-y: auto;
    }
    .menu.open { transform: translateX(0); }

    .menu a {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 28px;
      color: var(--text); text-decoration: none;
      font-size: 0.95rem; font-weight: 500;
      border-bottom: 1px solid var(--border);
      opacity: 0; transform: translateX(30px);
      transition: background 0.2s var(--ease), color var(--transition),
                  border-color var(--transition), transform 0.3s var(--ease),
                  opacity 0.3s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .menu.open a { animation: menu-item-in 0.4s var(--ease) forwards; }
    .menu.open a:nth-child(1) { animation-delay: 60ms; }
    .menu.open a:nth-child(2) { animation-delay: 105ms; }
    .menu.open a:nth-child(3) { animation-delay: 150ms; }
    .menu.open a:nth-child(4) { animation-delay: 195ms; }
    .menu.open a:nth-child(5) { animation-delay: 240ms; }
    .menu.open a:nth-child(6) { animation-delay: 285ms; }
    .menu.open a:nth-child(7) { animation-delay: 330ms; }
    .menu.open a:nth-child(8) { animation-delay: 375ms; }
.menu.open a:nth-child(9) { animation-delay: 420ms; }
.menu.open a:nth-child(10) { animation-delay: 465ms; }
    @keyframes menu-item-in { to { opacity: 1; transform: translateX(0); } }

    .menu a:hover { background: var(--bg-elevated); padding-left: 34px; }
    .menu a:active { background: var(--border); }

    .menu a .menu-icon {
      width: 20px; height: 20px; flex-shrink: 0; opacity: 0.6;
      transition: transform 0.4s var(--ease-spring), opacity 0.2s var(--ease);
    }
    .menu a:hover .menu-icon { transform: scale(1.25) rotate(-8deg); opacity: 0.9; }

    /* OVERLAY */

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0; pointer-events: none; z-index: 70;
      transition: opacity 0.35s var(--ease);
      backdrop-filter: blur(2px);
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    /* MAIN CONTENT */

    .main {
      padding-top: var(--header-h);
      min-height: 100vh;
    }

    .main-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px;
      animation: fade-up 0.6s var(--ease) both;
      animation-delay: 0.1s;
    }


    /* CHARACTER DETAIL */
    .char-detail { animation: fade-in 0.4s var(--ease) forwards; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    .char-back {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 24px;
      color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 500;
    }
    .char-back:hover { text-decoration: underline; }

    .char-header { display: flex; gap: 24px; align-items: flex-start; margin-bottom: 32px; }

    .char-avatar {
      width: 120px; height: 120px; border-radius: 20px; flex-shrink: 0;
      overflow: hidden; background: var(--bg-elevated);
      border: 1px solid var(--border);
    }
    .char-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .char-avatar-fallback {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      font-size: 3rem; font-weight: 700; color: var(--text-secondary);
    }

    .char-title { flex: 1; min-width: 0; }
    .char-title h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px; }
    .char-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .char-tag {
      padding: 4px 10px; border-radius: 12px; background: var(--bg-elevated);
      color: var(--text-secondary); font-size: 0.75rem; font-weight: 500;
    }

    .char-section { margin-bottom: 28px; }
    .char-section h2 { font-size: 1rem; font-weight: 700; margin-bottom: 10px; color: var(--text-secondary); }
    .char-section p { font-size: 0.95rem; line-height: 1.8; }

    .char-chat-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 28px; border: none; border-radius: 12px;
      background: var(--accent); color: white; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: transform 0.2s var(--ease), box-shadow 0.2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .char-chat-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(91,141,239,0.35); }
    .char-chat-btn:disabled { opacity: 0.5; pointer-events: none; }

    /* LOADING / ERROR */
    .loading-state, .error-state, .not-found {
      text-align: center; padding: 80px 20px;
    }
    .loading-spinner {
      width: 40px; height: 40px; margin: 0 auto 20px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p, .error-state p, .not-found p {
      color: var(--text-secondary); font-size: 0.95rem;
    }
    .not-found h1 { font-size: 3rem; font-weight: 800; margin-bottom: 12px; }
    .not-found a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .not-found a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .header { padding: 0 10px; }
      .logo { font-size: 1.05rem; }
      .account { margin-left: 8px; gap: 4px; }
      .login-pill { font-size: 0.72rem; padding: 5px 8px; gap: 4px; }
      .login-pill svg { width: 13px; height: 13px; }
      .icon-btn { width: 36px; height: 36px; }
      .account-btn { width: 32px; height: 32px; }
      .header-actions { gap: 2px; }
      .main-inner { padding: 24px 14px; }
    }

    /* 極小画面 (360px) — ログインpillをアイコンのみに */
    @media (max-width: 360px) {
      .login-pill { padding: 6px; }
      .login-pill svg { width: 14px; height: 14px; }
      .login-pill-text { display: none; }
      .logo { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <h1 class="logo" id="logo">
      <span>a</span><span>t</span><span>e</span><span>n</span><span>e</span><span>y</span>
    </h1>

    <!-- ACCOUNT -->
    <div class="account" id="account">
      <button class="account-btn" id="accountButton" aria-label="アカウント">
        <svg id="accountAvatar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
        </svg>
      </button>

      <a href="/login/" class="login-pill" id="loginPill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        <span class="login-pill-text">ログイン</span>
      </a>

      <!-- DROPDOWN -->
      <div class="account-menu" id="accountMenu">
        <!-- 動的に生成 -->
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn darkmode" id="darkmodeButton" aria-label="ダークモード切替">
        <div class="toggle-track">
          <div class="rays">
            <span style="--i: 0"></span><span style="--i: 1"></span>
            <span style="--i: 2"></span><span style="--i: 3"></span>
            <span style="--i: 4"></span><span style="--i: 5"></span>
            <span style="--i: 6"></span><span style="--i: 7"></span>
          </div>
          <div class="sun-core"></div>
          <div class="moon-cover"></div>
        </div>
      </button>

      <button class="icon-btn menu-button" id="menuButton" aria-label="メニュー">
        <div class="bars"><span></span><span></span><span></span></div>
      </button>
    </div>
  </header>

  <div class="overlay" id="overlay"></div>

  <!-- SLIDE MENU -->
  <nav class="menu" id="menu">
    <a href="/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
      Home
    </a>
    <a href="/characters/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
      Characters
    </a>
    <a href="/scene/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="5.5" r="2.5"/>
        <path d="M2 16c1.2 0 1.2-1.2 2.4-1.2S5.6 16 6.8 16 8 14.8 9.2 14.8 10.4 16 11.6 16s1.2-1.2 2.4-1.2S15.2 16 16.4 16s1.2-1.2 2.4-1.2S20 16 21.2 16"/>
        <path d="M2 21c1.2 0 1.2-1.2 2.4-1.2S5.6 21 6.8 21 8 19.8 9.2 19.8 10.4 21 11.6 21s1.2-1.2 2.4-1.2S15.2 21 16.4 21s1.2-1.2 2.4-1.2S20 21 21.2 21"/>
      </svg>
      Scene
    </a>
    <a href="/rag/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="1"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <path d="M6 12V6"/>
        <path d="M9 12V4.5"/>
        <path d="M12 12V7"/>
        <path d="M15 12V5.5"/>
        <path d="M18 12V8"/>
        <path d="M6 21v-6"/>
        <path d="M9 21v-4.5"/>
        <path d="M12 21v-7"/>
        <rect x="15" y="17" width="5" height="2.5" rx="0.5"/>
      </svg>
      RAG
    </a>
    <a href="/pack/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73z"/>
        <path d="M3.3 7.3 12 12l8.7-4.7"/>
        <path d="M12 22V12"/>
      </svg>
      Pack
    </a>
    <a href="/create/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/>
        <path d="m18 15 4-4"/>
        <path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/>
      </svg>
      Create
    </a>
    <a href="/library/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Library
    </a>
    <a href="/about/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      About
    </a>
    <a href="/settings/">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <!-- MAIN -->
  <main class="main">
    <div class="main-inner" id="content">
      <div class="loading-state">
        <div class="loading-spinner"></div>
        <p id="loading-text">キャラクターを呼んでいます...</p>
      </div>
    </div>
  </main>

  <script>
    const accountButton = document.getElementById("accountButton");
    const accountMenu = document.getElementById("accountMenu");

    // --- Auth state ---
    function getAuthUser() {
      try {
        const raw = localStorage.getItem("ateney-user");
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      // Also check for just a token
      if (localStorage.getItem("ateney-token")) {
        return { name: "ユーザー", id: "ログイン中" };
      }
      return null;
    }

    var authUser = null;
    try { var raw = localStorage.getItem("ateney-user"); if (raw) authUser = JSON.parse(raw); } catch (e) {}
    if (authUser) {
      var loginPill = document.getElementById("loginPill");
      if (loginPill) loginPill.style.display = "none";
    }

    // --- Hide login pill if logged in ---
    if (authUser) {
      loginPill.style.display = "none";
    }

    // --- Build account menu based on auth state ---
    function buildAccountMenu() {
      if (authUser) {
        // Logged in
        // ユーザー名・IDは信頼できない値のため、innerHTMLではなくtextContentで挿入する（XSS対策）。
        // 静的なメニュー構造のみinnerHTMLで組み立て、動的値は後から個別にセットする。
        accountMenu.innerHTML = `
          <div class="account-menu-header">
            <div class="avatar-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
              </svg>
            </div>
            <div>
              <div class="user-name" id="menuUserName"></div>
              <div class="user-id" id="menuUserId"></div>
            </div>
          </div>
          <a href="/profile/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
            プロフィール
          </a>
          <a href="/notifications/" id="notificationsLink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            通知
          </a>
          <a href="/account-settings/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            アカウント設定
          </a>
          <a href="/help/">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            ヘルプ
          </a>
          <a href="/logout/" class="logout" id="logoutBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            ログアウト
          </a>
        `;

        // 動的値はtextContentで安全に挿入（HTMLとして解釈されない）
        document.getElementById("menuUserName").textContent = authUser.name || "ユーザー";
        document.getElementById("menuUserId").textContent = authUser.id || "";

        // 通知バッジ: 未実装のため常時「3」を表示していた（ダミー値）。
        // 実データ連携までは非表示にする。
        // TODO: 実際の未読通知数をAPIから取得してここに反映する。

        // Logout handler — clear auth and redirect
        const logoutBtn = document.getElementById("logoutBtn");
        if (logoutBtn) {
          logoutBtn.addEventListener("click", (e) => {
            e.preventDefault();
            localStorage.removeItem("ateney-user");
            localStorage.removeItem("ateney-token");
            window.location.href = "/login/";
          });
        }
      } else {
        // Not logged in — show login button instead of logout
        accountMenu.innerHTML = `
          <div class="account-menu-header">
            <div class="avatar-sm">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
              </svg>
            </div>
            <div>
              <div class="user-name">ゲスト</div>
              <div class="user-id">未ログイン</div>
            </div>
          </div>
          <a href="/login/" class="login-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            ログイン
          </a>
        `;
      }
    }

    buildAccountMenu();

    // --- Dropdown toggle ---
    function toggleAccount(force) {
      const open = force !== undefined ? force : !accountMenu.classList.contains("open");
      accountMenu.classList.toggle("open", open);
    }

    accountButton.addEventListener("click", (e) => {
      e.stopPropagation();
      toggleAccount();
    });

    // Close when clicking outside
    document.addEventListener("click", (e) => {
      if (!accountMenu.contains(e.target) && e.target !== accountButton) {
        toggleAccount(false);
      }
    });

    // Close on Escape
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        toggleAccount(false);
        toggleMenu(false);
      }
    });
    /* =========================
       DARK MODE
    ========================= */
    const darkmodeButton = document.getElementById("darkmodeButton");
    function applyDarkMode(on) {
      document.body.classList.toggle("dark", on);
      darkmodeButton.classList.toggle("active", on);
    }
    try {
      if (localStorage.getItem("ateney-dark") === "1") applyDarkMode(true);
    } catch (e) {}
    darkmodeButton.addEventListener("click", function() {
      var isDark = !document.body.classList.contains("dark");
      applyDarkMode(isDark);
      try { localStorage.setItem("ateney-dark", isDark ? "1" : "0"); } catch (e) {}
    });

    /* =========================
       HAMBURGER MENU
    ========================= */
    var menuButton = document.getElementById("menuButton");
    var menu = document.getElementById("menu");
    var overlay = document.getElementById("overlay");
    function toggleMenu(force) {
      var open = force !== undefined ? force : !menu.classList.contains("open");
      menuButton.classList.toggle("open", open);
      menu.classList.toggle("open", open);
      overlay.classList.toggle("show", open);
    }
    menuButton.addEventListener("click", function() { toggleMenu(); });
    overlay.addEventListener("click", function() { toggleMenu(false); });

    /* =========================
       AUTH CHECK
    ========================= */

    /* =========================
       LOGO EASTER EGG
       ロゴをダブルクリックで隠しメッセージ
    ========================= */
    var logo = document.getElementById("logo");
    if (logo) {
      logo.addEventListener("dblclick", function(e) {
        e.preventDefault();
        var msgs = [
          "そこ。何もないよ。",
          "ダブルクリックする元気があるなら開発も進むはず。",
          "叩かないで。痛い。",
          "君、Troble好きでしょ。",
          "ここに何もないって言ったけど、実は何かあったら面白かったのにね。",
        ];
        var m = msgs[Math.floor(Math.random() * msgs.length)];
        var orig = logo.innerHTML;
        logo.innerHTML = '<span style="font-size:0.7rem;color:var(--accent)">' + m + '</span>';
        setTimeout(function() { logo.innerHTML = orig; }, 2500);
      });
    }

    /* =========================
       LOADING MESSAGE ROTATION
       ローディング中にメッセージが変わる
    ========================= */
    var loadingMsgs = [
      "ateneyがデータベースのチャイム鳴らしてます...",
      "まだ呼んでいます...",
      "DB「怒ってます。寝てたから。」",
      "DB「起きました、探してきます。」",
      "DB「もうちょっと。人前に出るので髪直してます。」",
      "DB「やっぱ二度寝します、おやすみ...」",
      "DB「Zzz...」",
      "ateneyがDBの扉を蹴り破ってデータ探しています。。。",
    ];
    var loadingIdx = 0;
    var loadingInterval = null;
    function startLoadingRotation() {
      var el = document.getElementById("loading-text");
      if (!el) return;
      loadingIdx = 0;
      loadingInterval = setInterval(function() {
        loadingIdx++;
        if (loadingIdx < loadingMsgs.length) {
          el.textContent = loadingMsgs[loadingIdx];
        }
      }, 1500);
    }
    function stopLoadingRotation() {
      if (loadingInterval) { clearInterval(loadingInterval); loadingInterval = null; }
    }

    /* =========================
       SPA ROUTER — 404.html ハック
       GitHub Pagesはファイルがないパスに404.htmlを返す。
       これを利用して /character/:uuid/ をルーティングする。
    ========================= */
    var path = window.location.pathname;
    var content = document.getElementById("content");
    var cfg = window.ATENEY_CONFIG || {};
    var apiBase = cfg.API_BASE || "https://ateney-api.ateney-ai.workers.dev";

    // UUID正規表現 — 12345678-1234-1234-1234-123456789abc
    var uuidRegex = /^\/character\/([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})\/?$/;
    var uuid = /^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$/;

    function setText(el, text) { if (el) el.textContent = text || ""; }

    var notFoundMessages = [
      { h: "404", p: "ここにページはなかった。妖精が持っていったのかも。もしかしたらTKに、、、" },
      { h: "404", p: "リンク切れ。頭も切れる。" },
      { h: "404", p: "ページが迷子になっています。道案内してあげてね。いざヴァルハラへ！" },
      { h: "40404040...", p: "このURL、行き止まり。しかし線路は続くよどこまでも" },
      { h: "404", p: "ページが存在しない。お前も存在しないかも" },
      { h: "404", p: "何も見つからない。静寂、お前の財布の中も静寂が支配している。" },
      { h: "404", p: "404 — 「存在しない」の3文字(!?)。" },
    ];

    function showNotFound() {
      document.title = "404 - ateney";
      var msg = notFoundMessages[Math.floor(Math.random() * notFoundMessages.length)];
      content.innerHTML =
        '<div class="not-found">' +
        '<h1>' + msg.h + '</h1>' +
        '<p>' + msg.p + '</p>' +
        '<p style="margin-top:20px"><a href="/">ホームに戻る</a></p>' +
        '</div>';
    }

    function showError(msg) {
      document.title = "エラー - ateney";
      content.innerHTML =
        '<div class="error-state">' +
        '<p>' + msg + '</p>' +
        '<p style="margin-top:16px"><a href="/" style="color:var(--accent);text-decoration:none;font-weight:500">ホームに戻る</a></p>' +
        '</div>';
    }

    function renderCharacter(c) {
      document.title = (c.name || "Character") + " - ateney";

      // アバター
      var avatarHtml = "";
      if (c.avatar_url) {
        avatarHtml = '<img src="' + c.avatar_url + '" alt="' + (c.name || "character") + '" onerror="this.parentElement.innerHTML=\'<div class=char-avatar-fallback>' + ((c.name || "?").charAt(0)) + '</div>\'">';
      } else {
        avatarHtml = '<div class="char-avatar-fallback">' + ((c.name || "?").charAt(0)) + '</div>';
      }

      // タグ
      var tagsHtml = "";
      if (c.tags) {
        var tagList = c.tags.split(",").map(function(t) { return t.trim(); }).filter(Boolean);
        tagsHtml = tagList.map(function(t) {
          return '<span class="char-tag">' + t + '</span>';
        }).join("");
      }
      // genreもタグとして表示
      if (c.genre) {
        var genres = c.genre.split(",").map(function(g) { return g.trim(); }).filter(Boolean);
        genres.forEach(function(g) {
          tagsHtml += '<span class="char-tag">' + g + '</span>';
        });
      }

      // セクション組み立て
      var html = '<div class="char-detail">';
      html += '<a href="/characters/" class="char-back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>キャラクター一覧</a>';

      html += '<div class="char-header">';
      html += '<div class="char-avatar">' + avatarHtml + '</div>';
      html += '<div class="char-title"><h1 id="char-name"></h1><div class="char-tags" id="char-tags">' + tagsHtml + '</div></div>';
      html += '</div>';

      if (c.description) {
        html += '<div class="char-section"><h2>説明</h2><p id="char-desc"></p></div>';
      }
      if (c.personality) {
        html += '<div class="char-section"><h2>性格</h2><p id="char-personality"></p></div>';
      }
      if (c.greeting) {
        html += '<div class="char-section"><h2>挨拶</h2><p id="char-greeting" style="font-style:italic"></p></div>';
      }

      html += '<div class="char-section"><button class="char-chat-btn" id="chat-btn" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>チャット開始（準備中）</button></div>';

      html += '</div>';

      content.innerHTML = html;

      // セキュアにDOM設定（XSS対策 — textContent使用）
      setText(document.getElementById("char-name"), c.name);
      setText(document.getElementById("char-desc"), c.description);
      setText(document.getElementById("char-personality"), c.personality);
      setText(document.getElementById("char-greeting"), c.greeting);
    }

    async function loadCharacter(uuid) {
      startLoadingRotation();
      try {
        var res = await fetch(apiBase + "/api/character/" + uuid);

        if (res.status === 404) {
          stopLoadingRotation();
          showNotFound();
          return;
        }
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }

        var data = await res.json();
        stopLoadingRotation();
        var c = data.character || data;
        renderCharacter(c);
      } catch (e) {
        console.error("[ateney] Failed to load character:", e);
        stopLoadingRotation();
        showError("キャラクターを読み込めませんでした: " + e.message);
      }
    }

    // ルーティング判定
    function getRoute() {
      var parts =
        window.location.pathname
          .split("/")
          .filter(Boolean);

      return {
        name: parts[0] || null,
        id: parts[1] || null,
      };
    }

    function router() {
      var route = getRoute();
    
      if (route.name === "character" && route.id) {
        loadCharacter(route.id);
        return;
      }
    
      showNotFound();
    }


    /* =========================
       START
    ========================= */

    router();
  </script>
</body>
</html>
