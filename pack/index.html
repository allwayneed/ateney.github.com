<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ateney — Pack</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --bg-elevated: #f5f5f7;
      --text: #1a1a1a;
      --text-secondary: #6e6e73;
      --border: #d1d1d6;
      --shadow: rgba(0, 0, 0, 0.08);
      --accent: #5b8def;

      --header-h: 60px;
      --menu-w: 280px;

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --transition: 0.35s var(--ease);
    }

    body.dark {
      --bg: #0d0d0f;
      --bg-elevated: #1c1c1e;
      --text: #f5f5f7;
      --text-secondary: #98989d;
      --border: #38383a;
      --shadow: rgba(0, 0, 0, 0.4);
      --accent: #7c9fff;
    }

    body {
      font-family: -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      transition: background var(--transition), color var(--transition);
    }

    /* VIEW TRANSITIONS */

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) { z-index: 9999; }

    /* HEADER */

    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      z-index: 90;
      transition: background var(--transition), border-color var(--transition);
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      user-select: none;
      cursor: default;
    }

    .logo span {
      display: inline-block;
      transition: transform 0.4s var(--ease-spring), color 0.3s var(--ease);
    }

    .logo:hover span { animation: logo-wave 0.8s var(--ease); }

    @keyframes logo-wave {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .logo span:nth-child(1) { animation-delay: 0ms; }
    .logo span:nth-child(2) { animation-delay: 60ms; }
    .logo span:nth-child(3) { animation-delay: 120ms; }
    .logo span:nth-child(4) { animation-delay: 180ms; }
    .logo span:nth-child(5) { animation-delay: 240ms; }
    .logo span:nth-child(6) { animation-delay: 300ms; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ICON BUTTONS + ripple */

    .icon-btn {
      position: relative;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: none; cursor: pointer;
      color: var(--text); border-radius: 50%;
      transition: background 0.2s var(--ease), color var(--transition);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    .icon-btn:active { background: var(--bg-elevated); }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.25;
      transform: translate(-50%, -50%) scale(0);
      animation: ripple-anim 0.6s var(--ease);
      pointer-events: none;
    }

    @keyframes ripple-anim {
      to { transform: translate(-50%, -50%) scale(4); opacity: 0; }
    }

    /* HAMBURGER */

    .menu-button .bars { position: relative; width: 22px; height: 16px; }

    .menu-button .bars span {
      display: block; position: absolute; left: 0;
      width: 100%; height: 2.5px; border-radius: 2px;
      background: currentColor;
      transition: transform 0.3s var(--ease), opacity 0.2s var(--ease);
    }

    .menu-button .bars span:nth-child(1) { top: 0; }
    .menu-button .bars span:nth-child(2) { top: 50%; transform: translateY(-50%); }
    .menu-button .bars span:nth-child(3) { bottom: 0; }

    .menu-button.open .bars span:nth-child(1) { transform: translateY(6.75px) rotate(45deg); }
    .menu-button.open .bars span:nth-child(2) { opacity: 0; }
    .menu-button.open .bars span:nth-child(3) { transform: translateY(-6.75px) rotate(-45deg); }

    /* DARK MODE TOGGLE */

    .darkmode { overflow: visible; }
    .darkmode .toggle-track { position: relative; width: 26px; height: 26px; }
    .darkmode .sun-core {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: currentColor; transform: translate(-50%, -50%);
      transition: all 0.4s var(--ease);
    }
    .darkmode .moon-cover {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--bg);
      transform: translate(-50%, -50%) translateX(0);
      opacity: 0;
      transition: opacity 0.4s var(--ease), background var(--transition), transform 0.4s var(--ease);
    }
    .darkmode .rays {
      position: absolute; top: 50%; left: 50%;
      width: 26px; height: 26px;
      transform: translate(-50%, -50%);
      transition: opacity 0.3s var(--ease);
      animation: rays-spin 20s linear infinite;
    }
    @keyframes rays-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .darkmode .rays span {
      position: absolute; top: 0; left: 50%;
      width: 2px; height: 5px; border-radius: 2px;
      background: currentColor;
      transform-origin: 50% 13px;
      transform: translateX(-50%) rotate(calc(var(--i) * 45deg));
      transition: height 0.3s var(--ease), opacity 0.3s var(--ease);
    }
    .darkmode.active .rays { animation-play-state: paused; }
    .darkmode.active .rays span { height: 0; opacity: 0; }
    .darkmode.active .moon-cover {
      opacity: 1;
      transform: translate(-50%, -50%) translateX(5px) translateY(-2px);
    }

    /* SLIDE MENU */

    .menu {
      position: fixed; top: 0; right: 0;
      width: var(--menu-w); height: 100vh; max-width: 85vw;
      background: var(--bg);
      border-left: 1px solid var(--border);
      padding: calc(var(--header-h) + 24px) 0 0 0;
      transform: translateX(100%);
      transition: transform 0.35s var(--ease), background var(--transition), border-color var(--transition);
      box-shadow: -8px 0 32px var(--shadow);
      z-index: 80;
      overflow-y: auto;
    }
    .menu.open { transform: translateX(0); }

    .menu a {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 28px;
      color: var(--text); text-decoration: none;
      font-size: 0.95rem; font-weight: 500;
      border-bottom: 1px solid var(--border);
      opacity: 0; transform: translateX(30px);
      transition: background 0.2s var(--ease), color var(--transition),
                  border-color var(--transition), transform 0.3s var(--ease),
                  opacity 0.3s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .menu.open a { animation: menu-item-in 0.4s var(--ease) forwards; }
    .menu.open a:nth-child(1) { animation-delay: 60ms; }
    .menu.open a:nth-child(2) { animation-delay: 110ms; }
    .menu.open a:nth-child(3) { animation-delay: 160ms; }
    .menu.open a:nth-child(4) { animation-delay: 210ms; }
    .menu.open a:nth-child(5) { animation-delay: 260ms; }
    .menu.open a:nth-child(6) { animation-delay: 310ms; }
    .menu.open a:nth-child(7) { animation-delay: 360ms; }
    @keyframes menu-item-in { to { opacity: 1; transform: translateX(0); } }

    .menu a:hover { background: var(--bg-elevated); padding-left: 34px; }
    .menu a:active { background: var(--border); }

    .menu a .menu-icon {
      width: 20px; height: 20px; flex-shrink: 0; opacity: 0.6;
      transition: transform 0.4s var(--ease-spring), opacity 0.2s var(--ease);
    }
    .menu a:hover .menu-icon { transform: scale(1.25) rotate(-8deg); opacity: 0.9; }

    /* OVERLAY */

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.3);
      opacity: 0; pointer-events: none; z-index: 70;
      transition: opacity 0.35s var(--ease);
      backdrop-filter: blur(2px);
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    /* MAIN CONTENT */

    .main {
      padding-top: var(--header-h);
      min-height: 100vh;
    }

    .main-inner {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px;
      animation: fade-up 0.6s var(--ease) both;
      animation-delay: 0.1s;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .main h2 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
      text-transform: capitalize;
    }

    /* PACK GRID */

    #pack-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .pack-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-elevated);
      cursor: pointer;

      opacity: 0;
      transform: translateY(20px) scale(0.97);
      animation: card-in 0.5s var(--ease) forwards;

      transition:
        transform 0.3s var(--ease),
        box-shadow 0.3s var(--ease),
        border-color 0.3s var(--ease);
    }

    @keyframes card-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .pack-card { animation-delay: calc(var(--card-index, 0) * 70ms); }

    .pack-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px var(--shadow);
      border-color: var(--accent);
    }

    .pack-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .pack-card .card-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--border);
    }

    .pack-card .card-image img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--ease);
    }

    .pack-card:hover .card-image img {
      transform: scale(1.08);
    }

    .card-image-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-secondary);
      font-size: 2.5rem; font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .pack-info {
      padding: 14px 16px;
    }

    .pack-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px;
      color: var(--text);
    }

    .pack-info p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* SKELETON LOADING */

    .skeleton-card {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-elevated);
    }

    .skeleton-card .skel-img,
    .skeleton-card .skel-line {
      background: linear-gradient(
        90deg,
        var(--border) 25%,
        var(--bg-elevated) 50%,
        var(--border) 75%
      );
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to   { background-position: -200% 0; }
    }

    .skeleton-card .skel-img {
      width: 100%;
      aspect-ratio: 1 / 1;
    }

    .skeleton-card .skel-body { padding: 14px 16px; }

    .skeleton-card .skel-line {
      height: 12px; border-radius: 6px; margin-bottom: 8px;
    }

    .skeleton-card .skel-line.short { width: 60%; }

    /* EMPTY / ERROR STATE */

    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .state-msg .state-emoji {
      font-size: 2rem;
      display: block;
      margin-bottom: 10px;
      animation: bob 2s var(--ease) infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* REDUCED MOTION */

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <!-- MAIN CONTENT -->
  <main class="main">
    <div class="main-inner">
      <h2>Pack</h2>
      <div id="pack-list"></div>
    </div>
  </main>

  <script>
    /* =========================
       HAMBURGER + OVERLAY
    ========================= */
    const menuButton = document.getElementById("menuButton");
    const menu = document.getElementById("menu");
    const overlay = document.getElementById("overlay");

    function toggleMenu(force) {
      const open = force !== undefined ? force : !menu.classList.contains("open");
      menuButton.classList.toggle("open", open);
      menu.classList.toggle("open", open);
      overlay.classList.toggle("show", open);
    }

    menuButton.addEventListener("click", () => toggleMenu());
    overlay.addEventListener("click", () => toggleMenu(false));

    /* =========================
       RIPPLE EFFECT
    ========================= */
    document.querySelectorAll(".icon-btn").forEach(btn => {
      btn.addEventListener("pointerdown", (e) => {
        const rect = btn.getBoundingClientRect();
        const ripple = document.createElement("span");
        ripple.className = "ripple";
        ripple.style.left = (e.clientX - rect.left) + "px";
        ripple.style.top = (e.clientY - rect.top) + "px";
        ripple.style.width = "60px";
        ripple.style.height = "60px";
        btn.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });

    /* =========================
       DARK MODE (circular reveal + persistence)
    ========================= */
    const darkmodeButton = document.getElementById("darkmodeButton");

    function applyDarkMode(on) {
      document.body.classList.toggle("dark", on);
      darkmodeButton.classList.toggle("active", on);
    }

    function toggleDarkMode() {
      const isDark = !document.body.classList.contains("dark");
      const rect = darkmodeButton.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      if (document.startViewTransition) {
        const transition = document.startViewTransition(() => {
          applyDarkMode(isDark);
        });
        transition.ready.then(() => {
          document.documentElement.animate(
            {
              clipPath: [
                `circle(0% at ${cx}px ${cy}px)`,
                `circle(150% at ${cx}px ${cy}px)`
              ]
            },
            {
              duration: 500,
              easing: "cubic-bezier(0.4, 0, 0.2, 1)",
              pseudoElement: "::view-transition-new(root)"
            }
          );
        });
      } else {
        applyDarkMode(isDark);
      }

      try { localStorage.setItem("ateney-dark", isDark ? "1" : "0"); } catch (e) {}
    }

    try {
      const saved = localStorage.getItem("ateney-dark");
      if (saved === "1") applyDarkMode(true);
    } catch (e) {}

    darkmodeButton.addEventListener("click", toggleDarkMode);

    /* =========================
       LOGO: re-trigger animation
    ========================= */
    const logo = document.getElementById("logo");
    logo.addEventListener("mouseenter", () => {
      logo.querySelectorAll("span").forEach(s => {
        s.style.animation = "none";
        void s.offsetWidth;
        s.style.animation = "";
      });
    });

    /* =========================
       PACK LIST
    ========================= */

    const API_URL = "https://ateney-api.ateney-ai.workers.dev/api/pack";
    const packContainer = document.getElementById("pack-list");

    function showSkeletons(count = 4) {
      packContainer.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const skel = document.createElement("div");
        skel.className = "skeleton-card";
        skel.innerHTML = `
          <div class="skel-img"></div>
          <div class="skel-body">
            <div class="skel-line"></div>
            <div class="skel-line short"></div>
          </div>
        `;
        packContainer.appendChild(skel);
      }
    }

    function showState(emoji, message) {
      packContainer.innerHTML = `
        <div class="state-msg">
          <span class="state-emoji">${emoji}</span>
          ${message}
        </div>
      `;
    }

    function setText(el, text) {
      el.textContent = text || "";
    }

    function createPackCard(pack, index) {
      const card = document.createElement("div");
      card.className = "pack-card";
      card.style.setProperty("--card-index", index);

      // Image area
      const imgWrap = document.createElement("div");
      imgWrap.className = "card-image";

      if (pack.avatar_url) {
        const img = document.createElement("img");
        img.alt = pack.name || "pack";
        img.loading = "lazy";
        img.src = pack.avatar_url;

        img.addEventListener("error", () => {
          imgWrap.innerHTML = "";
          const fb = document.createElement("div");
          fb.className = "card-image-fallback";
          setText(fb, (pack.name || "?").charAt(0));
          imgWrap.appendChild(fb);
        });

        imgWrap.appendChild(img);
      } else {
        const fb = document.createElement("div");
        fb.className = "card-image-fallback";
        setText(fb, (pack.name || "?").charAt(0));
        imgWrap.appendChild(fb);
      }

      // Info area
      const info = document.createElement("div");
      info.className = "pack-info";

      const name = document.createElement("h3");
      setText(name, pack.name);
      info.appendChild(name);

      if (pack.description) {
        const desc = document.createElement("p");
        setText(desc, pack.description);
        info.appendChild(desc);
      }

      card.appendChild(imgWrap);
      card.appendChild(info);
      return card;
    }

    async function loadPacks() {
      showSkeletons(4);

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const packs = data.packs || data.scenes || data || [];

        if (!Array.isArray(packs) || packs.length === 0) {
          showState("📦", "まだパックがありません");
          return;
        }

        packContainer.innerHTML = "";
        packs.forEach((pack, i) => {
          packContainer.appendChild(createPackCard(pack, i));
        });

      } catch (err) {
        console.error("Failed to load packs:", err);
        showState("⚠️", "パックを読み込めませんでした。たぶんメンテ中です");
      }
    }

    loadPacks();
  </script>
</body>
</html>
