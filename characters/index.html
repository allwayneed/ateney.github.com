<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="作成されたキャラクターの一覧">

  <title>Characters - ateney</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <script src="/config.js"></script>

    <link rel="stylesheet" href="/common.css">
  <style>
/* CHARACTER GRID */

    #character-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .character-card {
      display: block;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--bg-elevated);
      cursor: pointer;

      opacity: 0;
      transform: translateY(20px) scale(0.97);
      animation: card-in 0.5s var(--ease) forwards;

      transition:
        transform 0.3s var(--ease),
        box-shadow 0.3s var(--ease),
        border-color 0.3s var(--ease);
    }

    @keyframes card-in {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .character-card { animation-delay: calc(var(--card-index, 0) * 70ms); }

    .character-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px var(--shadow);
      border-color: var(--accent);
    }

    .character-card:active {
      transform: translateY(-1px) scale(0.99);
    }

    .character-card .card-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: var(--border);
    }

    .character-card .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--ease);
    }

    .character-card:hover .card-image img {
      transform: scale(1.08);
    }

    .card-image-fallback {
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 2.5rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .character-info {
      padding: 14px 16px;
    }

    .character-info h3 {
      font-size: 1rem;
      font-weight: 600;
      margin: 0 0 4px;
      color: var(--text);
    }

    .character-info p {
      margin: 0;
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* =========================
       RESPONSIVE — スマホ対応
    ========================= */

    /* カードグリッド */
    @media (max-width: 768px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 14px;
      }
    }
    @media (max-width: 480px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
    }
    @media (max-width: 360px) {
      #character-list {
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
        gap: 8px;
      }
      .character-info { padding: 10px 12px; }
      .character-info h3 { font-size: 0.88rem; }
      .character-info p { font-size: 0.75rem; }
    }


  </style>
</head>

<body>
  <script>
    /* ダークモードFOUC防止 — 描画前にbodyへクラスを付与 (実体はcommon.js) */
    try { if (localStorage.getItem("ateney-dark") === "1") document.body.classList.add("dark"); } catch (e) {}
  </script>
  <script src="/common.js"></script>

  <!-- HEADER / OVERLAY / SLIDE MENU は common.js が注入する (Issue #9) -->

  <main class="main">
    <div class="main-inner">
      <h2>character</h2>
      <div id="character-list"></div>
    </div>
  </main>

  <script>
/* =========================
       CHARACTER LIST
    ========================= */

    const cfg = window.ATENEY_CONFIG || {};
    const API_URL = (cfg.API_BASE || "") + "/api/character";
    const container = document.getElementById("character-list");

    function showSkeletons(count = 4) {
      container.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const skel = document.createElement("div");
        skel.className = "skeleton-card";
        skel.innerHTML = `
          <div class="skel-img"></div>
          <div class="skel-body">
            <div class="skel-line"></div>
            <div class="skel-line short"></div>
          </div>
        `;
        container.appendChild(skel);
      }
    }

    function showState(emoji, message) {
      container.innerHTML = `
        <div class="state-msg">
          <span class="state-emoji">${emoji}</span>
          ${message}
        </div>
      `;
    }

    function setText(el, text) {
      el.textContent = text || "";
    }

    function createCard(character, index) {
      const card = document.createElement("a");
      card.className = "character-card";
      card.href = "/character/" + character.id + "/";
      card.style.setProperty("--card-index", index);

      const imgWrap = document.createElement("div");
      imgWrap.className = "card-image";

      if (character.avatar_url) {
        const img = document.createElement("img");
        img.alt = character.name || "character";
        img.loading = "lazy";
        img.src = character.avatar_url;

        img.addEventListener("error", () => {
          imgWrap.innerHTML = "";
          const fb = document.createElement("div");
          fb.className = "card-image-fallback";
          setText(fb, (character.name || "?").charAt(0));
          imgWrap.appendChild(fb);
        });

        imgWrap.appendChild(img);
      } else {
        const fb = document.createElement("div");
        fb.className = "card-image-fallback";
        setText(fb, (character.name || "?").charAt(0));
        imgWrap.appendChild(fb);
      }

      const info = document.createElement("div");
      info.className = "character-info";

      const name = document.createElement("h3");
      setText(name, character.name);
      info.appendChild(name);

      if (character.description) {
        const desc = document.createElement("p");
        setText(desc, character.description);
        info.appendChild(desc);
      }

      card.appendChild(imgWrap);
      card.appendChild(info);
      return card;
    }

    async function loadCharacters() {
      showSkeletons(4);

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        const characters = data.characters || data.scenes || data || [];

        if (!Array.isArray(characters) || characters.length === 0) {
          showState("🌙", "まだキャラクターがいません。たぶんメンテ中です");
          return;
        }

        container.innerHTML = "";
        characters.forEach((char, i) => {
          container.appendChild(createCard(char, i));
        });

      } catch (err) {
        console.error("Failed to load characters:", err);
        showState("⚠️", "キャラクターを読み込めませんでした");
      }
    }

    loadCharacters();
    </script>
</body>
</html>
